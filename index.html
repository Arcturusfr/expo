<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>EXPOConnect v4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f2ee;--bg2:#fff;--bg3:#ece8e2;--card:#fff;
  --ac:#7a2035;--ac2:#9e2d47;--ad:#7a203518;
  --tx:#1e1a17;--t2:#6b5f57;--t3:#a0948c;
  --b1:#e0d9d1;--b2:#cec5bb;--red:#c0392b;
  --cs:#7a2035;--ca:#1a6fa8;--cv:#2d7a4f;
  --r:10px;--r2:16px;
  --s0:0 2px 12px rgba(120,80,60,.08);
  --s1:0 6px 28px rgba(120,80,60,.13);
  --s2:0 16px 56px rgba(120,80,60,.18);
}
html,body,#root{height:100%;background:var(--bg);}
body{font-family:'DM Sans',sans-serif;color:var(--tx);font-size:14px;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:var(--bg2);border-bottom:1px solid var(--b1);box-shadow:var(--s0);flex-shrink:0;z-index:100;}
.logo{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;letter-spacing:2px;color:var(--ac);}
.logo span{color:var(--t3);font-weight:400;font-style:italic;}
.hnav{display:flex;gap:3px;}
.nb{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .2s;}
.nb:hover{background:var(--bg3);color:var(--tx);}
.nb.on{background:var(--ad);color:var(--ac);}
.hr{display:flex;align-items:center;gap:8px;}
.abadge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;background:var(--ad);color:var(--ac);font-size:12px;font-weight:500;border:1px solid #7a203530;}
.ib{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--b1);background:transparent;color:var(--t2);cursor:pointer;transition:all .2s;}
.ib:hover{border-color:var(--ac);color:var(--ac);background:var(--ad);}
/* main */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.panel{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;background:var(--bg);}
.panel::-webkit-scrollbar{width:4px;}
.panel::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
/* search */
.sw{position:relative;margin-bottom:16px;}
.si{width:100%;padding:9px 14px 9px 38px;background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;box-shadow:var(--s0);}
.si:focus{outline:none;border-color:var(--ac);}
.si::placeholder{color:var(--t3);}
.sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none;}
/* filters */
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.fc{padding:4px 11px;border-radius:20px;border:1px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
.fc:hover{border-color:var(--ac);color:var(--ac);}
.fc.on{background:var(--ad);border-color:var(--ac);color:var(--ac);font-weight:500;}
/* cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:13px;}
.icard{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);cursor:pointer;transition:all .22s;overflow:hidden;box-shadow:var(--s0);}
.icard:hover{transform:translateY(-2px);box-shadow:var(--s1);}
.cacc{height:3px;}
.cbody{padding:14px;}
.chdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.cemoji{font-size:22px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:9px;flex-shrink:0;border:1px solid var(--b1);}
.cmeta{flex:1;min-width:0;}
.cbadge{display:inline-flex;align-items:center;gap:3px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:2px 6px;border-radius:4px;font-weight:500;margin-bottom:2px;}
.cname{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--tx);line-height:1.2;margin-bottom:1px;}
.csub{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;}
.cnum{font-size:11px;color:var(--ac);font-weight:500;}
.cdesc{font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cnote{font-size:12px;color:var(--t2);font-style:italic;margin-bottom:8px;}
.etags{display:flex;flex-wrap:wrap;gap:4px;}
.etag{display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;}
.edot{width:4px;height:4px;border-radius:50%;}
/* detail */
.dpanel{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);}
.dhero{padding:22px 22px 18px;border-bottom:1px solid var(--b1);background:var(--bg2);flex-shrink:0;box-shadow:var(--s0);}
.dback{display:flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--t3);font-size:13px;cursor:pointer;margin-bottom:16px;font-family:'DM Sans',sans-serif;transition:color .2s;}
.dback:hover{color:var(--ac);}
.dhd{display:flex;align-items:flex-start;gap:13px;}
.demoji{font-size:34px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0;border:1px solid var(--b1);}
.dtit{flex:1;}
.dname{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;color:var(--tx);margin-bottom:6px;}
.dchips{display:flex;flex-wrap:wrap;gap:5px;}
.dchip{padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.7px;background:var(--bg3);color:var(--t2);border:1px solid var(--b2);}
.dbody{padding:20px 22px;flex:1;}
.dsec{margin-bottom:22px;}
.dstit{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;letter-spacing:1px;color:var(--ac);text-transform:uppercase;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #7a203520;}
.ddesc{color:var(--t2);line-height:1.7;font-size:13px;}
.dctact{display:flex;flex-direction:column;gap:6px;}
.crow{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:13px;}
.crow a{color:var(--ac);text-decoration:none;}
/* events */
.elist{display:flex;flex-direction:column;gap:8px;}
.ecard{background:var(--bg);border:1px solid var(--b1);border-radius:var(--r);padding:11px 13px;border-left:3px solid;transition:all .2s;}
.ecard:hover{background:var(--bg2);}
.echd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.eb{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
.edt{font-size:11px;color:var(--t3);}
.etit{font-weight:500;color:var(--tx);font-size:13px;margin-bottom:2px;}
.edsc{font-size:12px;color:var(--t2);line-height:1.5;}
/* hall detail */
.hsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:8px;}
.hschip{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg);border:1px solid var(--b1);border-radius:8px;cursor:pointer;transition:all .15s;}
.hschip:hover{border-color:var(--ac);background:var(--ad);}
/* map */
.mcon{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.mtbar{display:flex;align-items:center;gap:9px;padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--b1);flex-shrink:0;box-shadow:var(--s0);flex-wrap:wrap;}
.mtit{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--ac);white-space:nowrap;}
.msel{padding:4px 9px;background:var(--bg);border:1px solid var(--b2);border-radius:6px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;}
.msel:focus{outline:none;border-color:var(--ac);}
.zbtns{display:flex;gap:3px;margin-left:auto;}
.zbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--b1);background:var(--bg3);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:13px;}
.zbtn:hover{border-color:var(--ac);color:var(--ac);}
.mhint{font-size:10px;color:var(--t3);}
.mwrap{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:var(--bg3);}
.mwrap:active{cursor:grabbing;}
.mleg{padding:6px 14px;background:var(--bg2);border-top:1px solid var(--b1);flex-shrink:0;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.mlg{display:flex;flex-direction:column;gap:2px;}
.mlt{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);font-weight:500;margin-bottom:1px;}
.mli{display:flex;gap:8px;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t2);cursor:pointer;transition:color .15s;}
.li:hover{color:var(--ac);}
.ld{width:8px;height:8px;border-radius:2px;}
/* agenda */
.agday{margin-bottom:22px;}
.agdt{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ac);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #7a203520;}
.agrow{display:flex;gap:11px;padding:11px 13px;background:var(--card);border:1px solid var(--b1);border-radius:var(--r);margin-bottom:6px;transition:all .2s;cursor:pointer;box-shadow:var(--s0);}
.agrow:hover{box-shadow:var(--s1);transform:translateX(2px);}
.agbar{width:3px;border-radius:2px;flex-shrink:0;}
.agcnt{flex:1;}
.agsn{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px;}
.agt{font-weight:500;color:var(--tx);margin-bottom:2px;font-size:13px;}
.agtype{font-size:11px;padding:2px 6px;border-radius:4px;display:inline-block;}
/* admin */
.alayout{flex:1;display:flex;overflow:hidden;}
.asidebar{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b1);padding:14px 9px;display:flex;flex-direction:column;gap:3px;}
.asbt{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--t3);padding:3px 9px 8px;}
.asi{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:7px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;text-align:left;transition:all .2s;width:100%;}
.asi:hover{background:var(--bg3);color:var(--tx);}
.asi.on{background:var(--ad);color:var(--ac);}
.asep{height:1px;background:var(--b1);margin:4px 7px;}
.acnt{flex:1;overflow-y:auto;padding:20px;background:var(--bg);}
.acnt::-webkit-scrollbar{width:4px;}
.acnt::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
.ahdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.aptit{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;color:var(--tx);}
/* buttons */
.bp{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:none;background:var(--ac);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.bp:hover{background:var(--ac2);}
.bp.bl{background:var(--ca);}
.bp.bl:hover{background:#1560a0;}
.bp.bv{background:var(--cv);}
.bp.bv:hover{background:#236040;}
.bs{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1px solid var(--b2);background:var(--bg2);color:var(--t2);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
.bs:hover{border-color:var(--ac);color:var(--ac);background:var(--ad);}
.bd{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:6px;border:1px solid #c0392b30;background:transparent;color:var(--red);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
.bd:hover{background:#c0392b10;border-color:var(--red);}
/* table */
.dtbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r2);overflow:hidden;box-shadow:var(--s0);border:1px solid var(--b1);}
.dtbl th{text-align:left;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);border-bottom:1px solid var(--b1);font-weight:500;background:var(--bg3);}
.dtbl td{padding:10px 12px;border-bottom:1px solid var(--b1);vertical-align:middle;}
.dtbl tr:last-child td{border-bottom:none;}
.dtbl tr:hover td{background:#f5f2ee;}
.tact{display:flex;gap:4px;}
/* modal */
.mo{position:fixed;inset:0;z-index:1000;background:rgba(30,20,15,.45);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px);}
.md{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r2);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:var(--s2);}
.md::-webkit-scrollbar{width:4px;}
.md::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--b1);position:sticky;top:0;background:var(--bg2);z-index:1;}
.mdt{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--tx);}
.mdb{padding:20px;}
.mdf{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--b1);position:sticky;bottom:0;background:var(--bg2);}
/* form */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.fgrp{display:flex;flex-direction:column;gap:4px;}
.fgrp.full{grid-column:1/-1;}
.fl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);font-weight:500;}
.fi,.fsl,.fta{padding:7px 10px;background:var(--bg);border:1px solid var(--b2);border-radius:7px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;transition:border .2s;}
.fi:focus,.fsl:focus,.fta:focus{outline:none;border-color:var(--ac);}
.fta{resize:vertical;min-height:68px;}
.fsl option{background:var(--bg2);color:var(--tx);}
/* login */
.lwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);}
.lcard{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:38px;width:100%;max-width:355px;box-shadow:var(--s2);}
.llg{text-align:center;margin-bottom:26px;}
.llgt{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;color:var(--ac);letter-spacing:2px;}
.llgs{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:2px;margin-top:4px;}
.ldiv{height:1px;background:var(--b1);margin:3px 0 6px;}
.lform{display:flex;flex-direction:column;gap:13px;}
.lerr{background:#c0392b0f;border:1px solid #c0392b30;border-radius:7px;padding:8px 12px;font-size:12px;color:var(--red);}
/* stats */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px;}
.scrd{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:17px;text-align:center;box-shadow:var(--s0);}
.sval{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--ac);line-height:1;}
.slbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
/* misc */
.copts{display:flex;gap:6px;flex-wrap:wrap;}
.csw{width:23px;height:23px;border-radius:5px;border:2px solid transparent;cursor:pointer;transition:all .2s;}
.csw.on{border-color:var(--ac);transform:scale(1.18);}
.ipick{display:flex;gap:4px;flex-wrap:wrap;}
.ib2{font-size:16px;width:31px;height:31px;border-radius:6px;border:1.5px solid var(--b2);background:var(--bg3);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.ib2.on{border-color:var(--ac);background:var(--ad);}
.spick{display:flex;gap:5px;flex-wrap:wrap;}
.sbtn{width:42px;height:34px;border-radius:6px;border:1.5px solid var(--b2);background:var(--bg3);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:17px;}
.sbtn.on{border-color:var(--ac);background:var(--ad);}
.empty{text-align:center;padding:48px 16px;}
.empty-i{font-size:34px;margin-bottom:9px;}
.empty-t{font-size:13px;color:var(--t2);}
.tgl{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--t2);}
.tgl input{accent-color:var(--ac);width:14px;height:14px;}
.divider{height:1px;background:var(--b1);margin:0 0 16px;}
.toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--ac);border-radius:9px;padding:10px 16px;color:#fff;font-size:13px;font-weight:500;box-shadow:0 8px 28px #7a203540;animation:su .3s ease;}
@keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
/* editor */
.elay{flex:1;display:flex;overflow:hidden;}
.elst{width:235px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;}
.elhd{padding:9px 11px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.elt{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--t3);font-weight:500;}
.eabtns{display:flex;gap:3px;}
.eabtn{padding:3px 6px;border-radius:5px;border:1px solid var(--b2);background:transparent;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.eabtn:hover{background:var(--bg3);}
.elbody{flex:1;overflow-y:auto;padding:5px;}
.elbody::-webkit-scrollbar{width:3px;}
.elbody::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
.elsec{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--t3);padding:8px 9px 3px;font-weight:600;}
.elrow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;transition:all .15s;border:1px solid transparent;}
.elrow:hover{background:var(--bg3);}
.elrow.on{background:var(--ad);border-color:#7a203528;}
.elname{font-size:12px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.elsub{font-size:10px;color:var(--t3);}
.ecol{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.etop{display:flex;align-items:center;gap:5px;padding:6px 11px;background:var(--bg2);border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap;}
.ebar{display:flex;align-items:center;gap:4px;padding:5px 11px;background:var(--bg2);border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap;}
.esep{width:1px;height:19px;background:var(--b2);margin:0 2px;}
.tbtn{display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:6px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tbtn:hover{border-color:var(--ac);color:var(--ac);background:var(--ad);}
.tbtn.on{background:var(--ac);color:#fff;border-color:var(--ac);}
.tbtn:disabled{opacity:.4;cursor:not-allowed;}
.ewrap{flex:1;overflow:hidden;position:relative;background:var(--bg3);}
.estat{padding:4px 11px;background:var(--bg2);border-top:1px solid var(--b1);font-size:11px;color:var(--t3);display:flex;gap:14px;flex-shrink:0;align-items:center;}
.eprops{width:268px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;}

/* helpers */
const fmtD=d=>{if(!d)return"";return new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});};
const hx=(h,a)=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;};
const li=(h,a)=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.round(r+(255-r)*a)},${Math.round(g+(255-g)*a)},${Math.round(b+(255-b)*a)})`;};
const dk=(h,a)=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.round(r*(1-a))},${Math.round(g*(1-a))},${Math.round(b*(1-a))})`;};
const SX=0.6,SY=0.3;
const ip=(px,py)=>[px+py*SX,py*SY];
const iTop=(x,y,w,h)=>[ip(x,y),ip(x+w,y),ip(x+w,y+h),ip(x,y+h)].map(p=>p.join(",")).join(" ");
const iFrt=(x,y,w,h,d)=>{const bl=ip(x,y+h),br=ip(x+w,y+h);return[bl.join(","),br.join(","),[br[0],br[1]+d].join(","),([ bl[0],bl[1]+d]).join(",")].join(" ");};
const iLft=(x,y,w,h,d)=>{const tl=ip(x,y),bl=ip(x,y+h);return[tl.join(","),bl.join(","),[bl[0],bl[1]+d].join(","),([ tl[0],tl[1]+d]).join(",")].join(" ");};
const iCtr=(x,y,w,h)=>ip(x+w/2,y+h/2);
const iShd=(x,y,w,h,d)=>{const[cx,cy]=ip(x+w/2,y+h);return{cx,cy:cy+d+4,rx:w*.45+d*.2,ry:(w*.45+d*.2)*.25};};

function useZT(zones){
  const roots=useMemo(()=>zones.filter(z=>!z.parentId),[zones]);
  const ch=useMemo(()=>{const m={};zones.forEach(z=>{if(z.parentId){if(!m[z.parentId])m[z.parentId]=[];m[z.parentId].push(z);}});return m;},[zones]);
  const desc=useCallback((id)=>{const r=[];const q=[id];while(q.length){const cur=q.shift();(ch[cur]||[]).forEach(c=>{r.push(c.id);q.push(c.id);});}return r;},[ch]);
  return{roots,ch,desc};
}

}

/* ═══ ISO ITEM SHAPE ═══ */
const DEP=16;
function IS({item,sel,hov,ro,onMD,onDbl,onCtx,onRS}){
  const base=item.color||FAM[item.fam]?.col||"#7a2035";
  const d=sel?20:hov?18:DEP;
  const cT=li(base,sel?.55:hov?.5:.42);
  const cL=li(base,sel?.15:hov?.12:.08);
  const cF=dk(base,sel?.15:hov?.1:.08);
  const sc=dk(base,.25);const sw=sel?2:1.2;
  const{x,y,w,h,shape,ico,icon}=item;
  const[icx,icy]=iCtr(x,y,w,h);
  const sn=n=>n.length>13?n.slice(0,13)+"…":n;
  const gp={style:{cursor:ro?"pointer":"move"},onMouseDown:e=>{e.stopPropagation();onMD&&onMD(e);},onDoubleClick:e=>{e.stopPropagation();onDbl&&onDbl();},onContextMenu:e=>{e.preventDefault();e.stopPropagation();onCtx&&onCtx(e);}};
  const hpos=[ip(x,y),ip(x+w/2,y),ip(x+w,y),ip(x+w,y+h/2),ip(x+w,y+h),ip(x+w/2,y+h),ip(x,y+h),ip(x,y+h/2)];
  const hkeys=["nw","n","ne","e","se","s","sw","w"];
  const handles=sel&&!ro?hkeys.map((c,i)=>(
    <rect key={c} x={hpos[i][0]-4} y={hpos[i][1]-4} width="8" height="8" rx="2"
      fill="#fff" stroke="#7a2035" strokeWidth="1.5" style={{cursor:`${c}-resize`}}
      onMouseDown={e=>{e.stopPropagation();onRS&&onRS(c,e);}}/>
  )):[];
  /* icon-only */
  if(ico||shape==="icon"){
    const sz=Math.min(w,h)*.7;
    return(<g {...gp}>
      {sel&&<rect x={x-3} y={y-3} width={w+6} height={h+6} rx="8" fill="none" stroke="#7a2035" strokeWidth="1.5" strokeDasharray="4,3"/>}
      <rect x={x} y={y} width={w} height={h} fill="transparent" stroke="transparent"/>
      <text x={x+w/2} y={y+h/2+1} textAnchor="middle" dominantBaseline="middle" fontSize={sz}>{icon}</text>
      {handles}
    </g>);
  }
  const sh=iShd(x,y,w,h,d);
  const shadow=<ellipse cx={sh.cx} cy={sh.cy} rx={sh.rx} ry={sh.ry} fill="rgba(0,0,0,0.18)" style={{filter:"blur(4px)"}}/>;
  /* rect */
  if(shape==="rect")return(<g {...gp}>
    {shadow}
    <polygon points={iLft(x,y,w,h,d)} fill={cL} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
    <polygon points={iFrt(x,y,w,h,d)} fill={cF} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
    <polygon points={iTop(x,y,w,h)} fill={cT} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
    {sel&&<polygon points={iTop(x-3,y-3,w+6,h+6)} fill="none" stroke="#7a2035" strokeWidth="1.5" strokeDasharray="5,3" opacity=".7"/>}
    <text x={icx} y={icy-2} textAnchor="middle" dominantBaseline="middle" fontSize="14">{icon}</text>
    <text x={icx} y={icy+13} textAnchor="middle" fill={dk(base,.45)} fontSize="9" fontFamily="DM Sans" fontWeight="700">{sn(item.name)}</text>
    {item.num&&<text x={icx} y={icy+23} textAnchor="middle" fill={dk(base,.3)} fontSize="7.5" fontFamily="DM Sans">{item.num}</text>}
    {item.events?.length>0&&<circle cx={ip(x+w,y)[0]-2} cy={ip(x+w,y)[1]-2} r="5" fill="#7a2035"/>}
    {handles}
  </g>);
  /* circle */
  if(shape==="circle"){
    const[ecx,ecy]=ip(x+w/2,y+h/2);const rx=w*.52,ry=rx*.38;
    return(<g {...gp}>
      {shadow}
      <path d={`M ${ecx-rx} ${ecy} L ${ecx-rx} ${ecy+d} A ${rx} ${ry} 0 0 0 ${ecx+rx} ${ecy+d} L ${ecx+rx} ${ecy} Z`} fill={cL} stroke={sc} strokeWidth={sw}/>
      <ellipse cx={ecx} cy={ecy+d} rx={rx} ry={ry} fill={cF} stroke={sc} strokeWidth={sw}/>
      <ellipse cx={ecx} cy={ecy} rx={rx} ry={ry} fill={cT} stroke={sc} strokeWidth={sw}/>
      {sel&&<ellipse cx={ecx} cy={ecy} rx={rx+4} ry={ry+3} fill="none" stroke="#7a2035" strokeWidth="1.5" strokeDasharray="5,3" opacity=".7"/>}
      <text x={ecx} y={ecy-2} textAnchor="middle" dominantBaseline="middle" fontSize="13">{icon}</text>
      <text x={ecx} y={ecy+12} textAnchor="middle" fill={dk(base,.45)} fontSize="9" fontFamily="DM Sans" fontWeight="700">{sn(item.name)}</text>
      {handles}
    </g>);
  }
  /* diamond */
  if(shape==="diamond"){
    const cx2=x+w/2,cy2=y+h/2;
    const dT=ip(cx2,y),dR=ip(x+w,cy2),dB=ip(cx2,y+h),dL=ip(x,cy2);
    const topD=[dT,dR,dB,dL].map(p=>p.join(",")).join(" ");
    const frtD=[dL.join(","),dB.join(","),[dB[0],dB[1]+d].join(","),([ dL[0],dL[1]+d]).join(",")].join(" ");
    const lftD=[dT.join(","),dL.join(","),[dL[0],dL[1]+d].join(","),([ dT[0],dT[1]+d]).join(",")].join(" ");
    return(<g {...gp}>
      {shadow}
      <polygon points={lftD} fill={cL} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      <polygon points={frtD} fill={cF} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      <polygon points={topD} fill={cT} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      {sel&&<polygon points={topD} fill="none" stroke="#7a2035" strokeWidth="1.5" strokeDasharray="5,3" opacity=".7"/>}
      <text x={icx} y={icy-2} textAnchor="middle" dominantBaseline="middle" fontSize="13">{icon}</text>
      <text x={icx} y={icy+12} textAnchor="middle" fill={dk(base,.45)} fontSize="9" fontFamily="DM Sans" fontWeight="700">{sn(item.name)}</text>
      {handles}
    </g>);
  }
  /* triangle */
  if(shape==="triangle"){
    const tx2=ip(x+w/2,y),tbl=ip(x,y+h),tbr=ip(x+w,y+h);
    const topT=[tx2,tbr,tbl].map(p=>p.join(",")).join(" ");
    const frtT=[tbl.join(","),tbr.join(","),[tbr[0],tbr[1]+d].join(","),([ tbl[0],tbl[1]+d]).join(",")].join(" ");
    const lftT=[tx2.join(","),tbl.join(","),[tbl[0],tbl[1]+d].join(","),([ tx2[0],tx2[1]+d]).join(",")].join(" ");
    return(<g {...gp}>
      {shadow}
      <polygon points={lftT} fill={cL} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      <polygon points={frtT} fill={cF} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      <polygon points={topT} fill={cT} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      {sel&&<polygon points={topT} fill="none" stroke="#7a2035" strokeWidth="1.5" strokeDasharray="5,3" opacity=".7"/>}
      <text x={icx} y={icy} textAnchor="middle" dominantBaseline="middle" fontSize="13">{icon}</text>
      <text x={icx} y={icy+13} textAnchor="middle" fill={dk(base,.45)} fontSize="9" fontFamily="DM Sans" fontWeight="700">{sn(item.name)}</text>
      {handles}
    </g>);
  }
  /* hexagon */
  if(shape==="hexagon"){
    const r2=Math.min(w,h)/2;
    const pts=Array.from({length:6},(_,i)=>{const a=(i*60-30)*Math.PI/180;return ip(x+w/2+r2*Math.cos(a),y+h/2+r2*Math.sin(a));});
    const topH=pts.map(p=>p.join(",")).join(" ");
    const lftH=[pts[3],pts[4],pts[5],pts[0]].map(p=>p.join(",")).join(" ");
    const frtH=[pts[4],pts[5],[pts[5][0],pts[5][1]+d].join(","),([ pts[4][0],pts[4][1]+d]).join(",")].join(" ");
    return(<g {...gp}>
      {shadow}
      <polygon points={lftH} fill={cL} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      <polygon points={frtH} fill={cF} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      <polygon points={topH} fill={cT} stroke={sc} strokeWidth={sw} strokeLinejoin="round"/>
      {sel&&<polygon points={topH} fill="none" stroke="#7a2035" strokeWidth="1.5" strokeDasharray="5,3" opacity=".7"/>}
      <text x={icx} y={icy-1} textAnchor="middle" dominantBaseline="middle" fontSize="13">{icon}</text>
      <text x={icx} y={icy+12} textAnchor="middle" fill={dk(base,.45)} fontSize="9" fontFamily="DM Sans" fontWeight="700">{sn(item.name)}</text>
      {handles}
    </g>);
  }
  return null;
}

/* ═══ ZONE SHAPE ═══ */
function ZS({zone,sel,ro,onMD,onDbl,onCtx,onRS,icount,zcount}){
  const fc=zone.color||"#1a6fa8";const dep=8;
  const{x,y,w,h}=zone;
  const[lcx,lcy]=iCtr(x,y,w,h);
  const[np,npy]=ip(x+12,y+10);
  const hpos=[ip(x,y),ip(x+w/2,y),ip(x+w,y),ip(x+w,y+h/2),ip(x+w,y+h),ip(x+w/2,y+h),ip(x,y+h),ip(x,y+h/2)];
  const hkeys=["nw","n","ne","e","se","s","sw","w"];
  const handles=sel&&!ro?hkeys.map((c,i)=>(
    <rect key={c} x={hpos[i][0]-4} y={hpos[i][1]-4} width="8" height="8" rx="2"
      fill="#fff" stroke="#5a4a3a" strokeWidth="1.5" style={{cursor:`${c}-resize`}}
      onMouseDown={e=>{e.stopPropagation();onRS&&onRS(c,e);}}/>
  )):[];
  const gp={style:{cursor:ro?"default":"move"},onMouseDown:e=>{e.stopPropagation();onMD&&onMD(e);},onDoubleClick:e=>{e.stopPropagation();onDbl&&onDbl();},onContextMenu:e=>{e.preventDefault();e.stopPropagation();onCtx&&onCtx(e);}};
  return(<g {...gp}>
    <polygon points={iLft(x,y,w,h,dep)} fill={li(fc,.72)} stroke={fc} strokeWidth="1" strokeLinejoin="round"/>
    <polygon points={iFrt(x,y,w,h,dep)} fill={li(fc,.65)} stroke={fc} strokeWidth="1" strokeLinejoin="round"/>
    <polygon points={iTop(x,y,w,h)} fill={li(fc,.82)} stroke={sel?"#5a4a3a":fc} strokeWidth={sel?2:1.5} strokeLinejoin="round" strokeDasharray={sel?undefined:"6,4"}/>
    {sel&&<polygon points={iTop(x-3,y-3,w+6,h+6)} fill="none" stroke="#5a4a3a" strokeWidth="1" strokeDasharray="5,3" opacity=".5"/>}
    <text x={np} y={npy} fill={dk(fc,.2)} fontSize="12" fontWeight="700" fontFamily="Cormorant Garamond">{zone.name}</text>
    <text x={lcx+15} y={lcy+5} fill={dk(fc,.1)} fontSize="8.5" textAnchor="middle" fontFamily="DM Sans" opacity=".85">
      {[icount>0&&`${icount} élém.`,zcount>0&&`${zcount} zone${zcount>1?"s":""}`].filter(Boolean).join(" · ")}
    </text>
    {handles}
  </g>);
}

  const goItem=id=>{setSelIK(String(id));setView("detail");};

        </div>
        <div className="frow">
          {[["all","Tout"],["stand","Stands"],["access","Circulations"],["service","Services"]].map(([k,l])=>(
            <button key={k} className={`fc ${filterF===k?"on":""}`} onClick={()=>setFilterF(k)}>{l}</button>
          ))}
        </div>
        {filtered.length===0?<div className="empty"><div className="empty-i">🔍</div><div className="empty-t">Aucun résultat</div></div>
          :<div className="cgrid">{filtered.map(c=><IC key={c.id} item={c} zone={zones.find(z=>z.id===c.zid)} onClick={()=>goItem(c.id)}/>)}</div>}

/* ── Map View ── */
function MapV({zones,items,subZ,singleZ,subViews,mapZid,setMapZid,mapSub,setMapSub,effZ,allItems,onItemClick,onZoneClick}){
  const wRef=useRef(null);
  const trR=useRef({x:0,y:0,s:1});
  const[trD,setTrD]=useState({x:0,y:0,s:1});
  const drag=useRef(null);const pinch=useRef(null);
  const sf=(v,f=0)=>isFinite(v)&&!isNaN(v)?v:f;
  const clS=s=>Math.min(4,Math.max(.25,sf(s,1)));
  const apT=(nx,ny,ns)=>{const t={x:sf(nx,trR.current.x),y:sf(ny,trR.current.y),s:clS(ns)};trR.current=t;setTrD({...t});};
  const oW=useCallback(e=>{e.preventDefault();apT(trR.current.x,trR.current.y,trR.current.s*(e.deltaY<0?1.1:.9));},[]);
  useEffect(()=>{const el=wRef.current;if(!el)return;el.addEventListener("wheel",oW,{passive:false});return()=>el.removeEventListener("wheel",oW);},[oW]);
  const oTM=useCallback(e=>{if(e.touches.length===2&&pinch.current?.d>0){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);if(d>0)apT(trR.current.x,trR.current.y,clS(pinch.current.s*(d/pinch.current.d)));}},[]);
  useEffect(()=>{const el=wRef.current;if(!el)return;el.addEventListener("touchmove",oTM,{passive:false});return()=>el.removeEventListener("touchmove",oTM);},[oTM]);
  const oMD=e=>{drag.current={sx:e.clientX-trR.current.x,sy:e.clientY-trR.current.y};};
  const oMM=e=>{if(!drag.current)return;apT(e.clientX-drag.current.sx,e.clientY-drag.current.sy,trR.current.s);};
  const oMU=()=>{drag.current=null;};
  const oTS=e=>{if(e.touches.length===1)drag.current={sx:e.touches[0].clientX-trR.current.x,sy:e.touches[0].clientY-trR.current.y};else if(e.touches.length===2){drag.current=null;const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);if(d>0)pinch.current={d,s:trR.current.s};}};
  const oTE=()=>{pinch.current=null;};
  const zoom=d=>apT(trR.current.x,trR.current.y,trR.current.s*(d>0?1.25:.8));
  const reset=()=>apT(0,0,1);
  const{x:tx,y:ty,s:ts}=trD;
  const[hov,setHov]=useState(null);
  return(<div className="mcon">

/* ═══ PLAN EDITOR ═══ */
function PE({zones,setZones,items,setItems,ztypes,showToast,edZid,setEdZid}){
  const cRef=useRef(null);
  const[selK,setSelK]=useState(null);
  const[selZK,setSelZK]=useState(null);
  const[tool,setTool]=useState("select");
  const[snapOn,setSnapOn]=useState(true);
  const[gs,setGs]=useState(20);
  const[showG,setShowG]=useState(true);
  const[zoom,setZoom]=useState(1);
  const[off,setOff]=useState({x:20,y:20});
  const[stat,setStat]=useState("Prêt");
  const[hist,setHist]=useState([{items,zones}]);
  const[hi,setHi]=useState(0);
  const[ctx,setCtx]=useState(null);
  const[draw,setDraw]=useState(null);
  const[eM,setEM]=useState(null);
  const[eZM,setEZM]=useState(null);
  const[conf,setConf]=useState(null);
  const dRef=useRef(null);const rRef=useRef(null);
  const zdRef=useRef(null);const zrRef=useRef(null);
  const panRef=useRef(null);
  const sn=v=>snapOn?Math.round(v/gs)*gs:v;
  const clZ=z=>Math.min(3.5,Math.max(.25,z));
  const edZ=zones.find(z=>z.id===edZid);
  const subZ=zones.filter(z=>z.parentId===edZid);
  const edItems=items.filter(i=>i.zid===edZid);
  const selIt=selK?items.find(i=>`item-${i.id}`===selK):null;
  const selZn=selZK?zones.find(z=>z.id===selZK):null;
  const pushH=useCallback((ni,nz)=>{setHist(h=>{const n=h.slice(0,hi+1);n.push({items:ni,zones:nz});return n;});setHi(i=>i+1);},[hi]);
  const undo=()=>{if(hi>0){const n=hi-1;setItems(hist[n].items);setZones(hist[n].zones);setHi(n);showToast("Annulé");}};
  const redo=()=>{if(hi<hist.length-1){const n=hi+1;setItems(hist[n].items);setZones(hist[n].zones);setHi(n);showToast("Rétabli");}};
  const svc=useCallback(e=>{const r=cRef.current?.getBoundingClientRect();if(!r)return{x:0,y:0};return{x:(e.clientX-r.left-off.x)/zoom,y:(e.clientY-r.top-off.y)/zoom};},[off,zoom]);
  const uI=(id,p)=>setItems(prev=>prev.map(i=>i.id===id?{...i,...p}:i));
  const uZ=(id,p)=>setZones(prev=>prev.map(z=>z.id===id?{...z,...p}:z));
  const oW=useCallback(e=>{e.preventDefault();setZoom(z=>clZ(z*(e.deltaY<0?1.1:.9)));},[]);
  useEffect(()=>{const el=cRef.current;if(!el)return;el.addEventListener("wheel",oW,{passive:false});return()=>el.removeEventListener("wheel",oW);},[oW]);
  const oMD=e=>{setCtx(null);if(tool==="select"){panRef.current={sx:e.clientX-off.x,sy:e.clientY-off.y};setSelK(null);setSelZK(null);}if(tool.startsWith("draw")){const c=svc(e);setDraw({sx:sn(c.x),sy:sn(c.y),ex:sn(c.x),ey:sn(c.y)});}};
  const oMM=useCallback(e=>{
    if(panRef.current){setOff({x:e.clientX-panRef.current.sx,y:e.clientY-panRef.current.sy});return;}
    if(zdRef.current){const{id,ox,oy}=zdRef.current;const c=svc(e);const nx=sn(c.x-ox),ny=sn(c.y-oy);uZ(id,{x:Math.max(0,nx),y:Math.max(0,ny)});setStat(`Zone X=${Math.round(nx)} Y=${Math.round(ny)}`);return;}

            <div className="pr"><span className="pl">Type</span>
              <input className="pi" list="ztl" value={selZn.type} onChange={e=>uZ(selZn.id,{type:e.target.value})} onBlur={()=>pushH(items,zones)}/>
              <datalist id="ztl">{ztypes.map(t=><option key={t} value={t}/>)}</datalist>
            </div>
            <label className="tgl" style={{marginBottom:5,marginTop:4}}>
              <input type="checkbox" checked={!!selZn.isSingle} onChange={e=>{uZ(selZn.id,{isSingle:e.target.checked});pushH(items,zones.map(z=>z.id===selZn.id?{...z,isSingle:e.target.checked}:z));}}/>
              Vue isolée pour le visiteur
            </label>
            <label className="tgl" style={{marginBottom:5}}>
              <input type="checkbox" checked={!!selZn.isDefault} onChange={e=>{const v=e.target.checked;if(v)setZones(p=>p.map(z=>({...z,isDefault:z.id===selZn.id})));else uZ(selZn.id,{isDefault:false});pushH(items,zones.map(z=>({...z,isDefault:z.id===selZn.id?v:v?false:z.isDefault})));}}/>
              Vue par défaut (accueil visiteur)
            </label>
            <div style={{marginTop:6}}><button className="bp" style={{width:"100%",justifyContent:"center",fontSize:11,background:"#5a4a3a"}} onClick={()=>setEZM(selZn)}><Ic n="edit" s={11}/> Éditer les infos</button></div>
          </div>
          <div className="psec">
            <div className="pst">Position & Taille</div>
            <div className="pr2">{[["x","X"],["y","Y"]].map(([k,l])=><div key={k} className="pf"><label>{l}</label><input type="number" value={selZn[k]} onChange={e=>uZ(selZn.id,{[k]:+e.target.value})} onBlur={()=>pushH(items,zones)}/></div>)}</div>
            <div className="pr2">{[["w","Larg."],["h","Haut."]].map(([k,l])=><div key={k} className="pf"><label>{l}</label><input type="number" value={selZn[k]} onChange={e=>uZ(selZn.id,{[k]:+e.target.value})} onBlur={()=>pushH(items,zones)}/></div>)}</div>
          </div>
          <div className="psec">
            <div className="pst">Couleur</div>
            <div className="copts">{ZCOLS.map(c=><div key={c} className={`csw ${selZn.color===c?"on":""}`} style={{background:c}} onClick={()=>{uZ(selZn.id,{color:c});pushH(items,zones.map(z=>z.id===selZn.id?{...z,color:c}:z));}}/>)}</div>
          </div>
          <div className="psec">
            <div className="pst">Actions</div>
            <button className="bd" style={{width:"100%",justifyContent:"center"}} onClick={()=>delZE(selZn.id)}><Ic n="del" s={12}/> Supprimer la zone</button>
          </div>
        </>)}
      </div>
    </div>
    {ctx&&(<div className="ctx" style={{left:ctx.x,top:ctx.y}} onMouseLeave={()=>setCtx(null)}>
      {ctx.type==="item"&&<>
        <div className="ci" onClick={()=>{const it=items.find(i=>i.id===ctx.id);if(it)setEM({item:it});setCtx(null);}}><Ic n="edit" s={12}/> Éditer</div>
        <div className="ci" onClick={()=>{dupI(ctx.id);setCtx(null);}}><Ic n="dup" s={12}/> Dupliquer</div>
        <div className="csep"/>
        <div className="ci red" onClick={()=>{delIE(ctx.id);setCtx(null);}}><Ic n="del" s={12}/> Supprimer</div>
      </>}
      {ctx.type==="zone"&&<>
        <div className="ci" onClick={()=>{const z=zones.find(x=>x.id===ctx.id);if(z)setEZM(z);setCtx(null);}}><Ic n="edit" s={12}/> Éditer la zone</div>
        <div className="csep"/>
        <div className="ci red" onClick={()=>{delZE(ctx.id);setCtx(null);}}><Ic n="del" s={12}/> Supprimer</div>
      </>}
    </div>)}
    {eM&&<IM item={eM.item} zones={zones} ztypes={ztypes} onSave={d=>{uI(d.id,d);pushH(items.map(i=>i.id===d.id?{...i,...d}:i),zones);showToast("Mis à jour ✓");setEM(null);}} onClose={()=>setEM(null)}/>}
    {eZM&&<ZM zone={eZM} zones={zones} ztypes={ztypes} onSave={d=>{if(d.id){let nz=zones.map(z=>z.id===d.id?{...z,...d}:z);if(d.isDefault)nz=nz.map(z=>({...z,isDefault:z.id===d.id}));setZones(nz);pushH(items,nz);}else{const nid="z"+Date.now();const nz=[...zones,{...d,id:nid}];setZones(nz);pushH(items,nz);}showToast("Mis à jour ✓");setEZM(null);}} onClose={()=>setEZM(null)}/>}
    {conf&&<CM msg={conf.msg} onConfirm={conf.fn} onClose={()=>setConf(null)}/>}
  </div>);}

/* ═══ MODALS ═══ */
function IM({item,zones,ztypes,onSave,onClose}){
  const isN=!item.id;
  const fm=FAM[item.fam||"stand"];
  const[f,setF]=useState({
    name:item.name||"",fam:item.fam||"stand",shape:item.shape||"rect",ico:item.ico||false,
    icon:item.icon||(item.fam==="access"?"🚪":item.fam==="service"?"ℹ️":"🏢"),
    color:item.color||(item.fam==="access"?"#1a6fa8":item.fam==="service"?"#2d7a4f":SCOLS[0]),
    num:item.num||"",sector:item.sector||"",sub:item.sub||"",
    desc:item.desc||"",contact:item.contact||"",web:item.web||"",note:item.note||"",
    zid:item.zid||zones[0]?.id||"",
  });
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const icons=f.fam==="access"?AICO:f.fam==="service"?VICO:SEMOJI;
  return(<div className="mo"><div className="md">
    <div className="mhd"><div className="mdt">{isN?"Nouvel élément":`Modifier — ${item.name}`}</div><button className="ib" onClick={onClose}><Ic n="x" s={13}/></button></div>
    <div className="mdb"><div className="fg">
      <div className="fgrp"><label className="fl">Famille</label><select className="fsl" value={f.fam} onChange={e=>s("fam",e.target.value)}>{Object.values(FAM).map(fm=><option key={fm.k} value={fm.k}>{fm.lbl}</option>)}</select></div>
      <div className="fgrp"><label className="fl">Zone</label><select className="fsl" value={f.zid} onChange={e=>s("zid",e.target.value)}>{zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}</select></div>
      <div className="fgrp full"><label className="fl">Nom *</label><input className="fi" value={f.name} onChange={e=>s("name",e.target.value)}/></div>
      {f.fam==="stand"&&<>
        <div className="fgrp"><label className="fl">N° stand</label><input className="fi" value={f.num} onChange={e=>s("num",e.target.value)}/></div>
        <div className="fgrp"><label className="fl">Secteur</label><select className="fsl" value={f.sector} onChange={e=>s("sector",e.target.value)}><option value="">—</option>{SECTORS.map(x=><option key={x}>{x}</option>)}</select></div>
        <div className="fgrp full"><label className="fl">Description</label><textarea className="fta" value={f.desc} onChange={e=>s("desc",e.target.value)}/></div>
        <div className="fgrp"><label className="fl">Email</label><input className="fi" value={f.contact} onChange={e=>s("contact",e.target.value)}/></div>
        <div className="fgrp"><label className="fl">Site web</label><input className="fi" value={f.web} onChange={e=>s("web",e.target.value)}/></div>
      </>}
      {(f.fam==="access"||f.fam==="service")&&<>
        <div className="fgrp full"><label className="fl">Type</label><select className="fsl" value={f.sub} onChange={e=>s("sub",e.target.value)}><option value="">—</option>{(f.fam==="access"?ATYP:VTYP).map(t=><option key={t}>{t}</option>)}</select></div>
        <div className="fgrp full"><label className="fl">Note / Horaires</label><input className="fi" value={f.note} onChange={e=>s("note",e.target.value)} placeholder="Ex: Ouvert 8h–20h"/></div>
      </>}
      <div className="fgrp full">
        <label className="fl">Forme</label>
        <div className="spick">{SHAPES.map(sh=><button key={sh} className={`sbtn ${f.shape===sh&&!f.ico?"on":""}`} title={SLBL[sh]} onClick={()=>s("shape",sh)}>
          {sh==="rect"?"■":sh==="circle"?"●":sh==="diamond"?"◆":sh==="triangle"?"▲":sh==="hexagon"?"⬡":"🔷"}
        </button>)}</div>
        <label className="tgl" style={{marginTop:7}}><input type="checkbox" checked={f.ico} onChange={e=>s("ico",e.target.checked)}/> Pictogramme seul (sans volume 3D)</label>
      </div>
      <div className="fgrp full"><label className="fl">Icône</label><div className="ipick">{icons.map(e=><button key={e} className={`ib2 ${f.icon===e?"on":""}`} onClick={()=>s("icon",e)}>{e}</button>)}</div></div>
      <div className="fgrp full"><label className="fl">Couleur</label><div className="copts">{SCOLS.map(c=><div key={c} className={`csw ${f.color===c?"on":""}`} style={{background:c}} onClick={()=>s("color",c)}/>)}</div></div>
    </div></div>
    <div className="mdf"><button className="bs" onClick={onClose}>Annuler</button><button className="bp" onClick={()=>{if(f.name)onSave({...item,...f});}}>{isN?"Créer":"Enregistrer"}</button></div>
  </div></div>);}

function ZM({zone,zones,ztypes,onSave,onClose}){
  const isN=!zone.id;
  const allT=[...new Set([...DZTYPES,...(ztypes||[])])];
  const[f,setF]=useState({
    name:zone.name||"",type:zone.type||"Zone",parentId:zone.parentId||"",
    isDefault:zone.isDefault||false,isSingle:zone.isSingle||false,
    color:zone.color||ZCOLS[0],x:zone.x||60,y:zone.y||60,w:zone.w||300,h:zone.h||120,
  });
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  return(<div className="mo"><div className="md" style={{maxWidth:500}}>
    <div className="mhd"><div className="mdt">{isN?"Nouvelle zone":`Modifier — ${zone.name}`}</div><button className="ib" onClick={onClose}><Ic n="x" s={13}/></button></div>
    <div className="mdb"><div className="fg">
      <div className="fgrp full"><label className="fl">Nom *</label><input className="fi" value={f.name} onChange={e=>s("name",e.target.value)}/></div>
      <div className="fgrp"><label className="fl">Type</label>
        <input className="fi" list="ztypes2" value={f.type} onChange={e=>s("type",e.target.value)} placeholder="Bâtiment, Étage, Zone…"/>
        <datalist id="ztypes2">{allT.map(t=><option key={t} value={t}/>)}</datalist>
      </div>
      <div className="fgrp"><label className="fl">Zone parente</label>
        <select className="fsl" value={f.parentId||""} onChange={e=>s("parentId",e.target.value||null)}>
          <option value="">— Aucune (racine) —</option>
          {zones.filter(z=>z.id!==zone.id).map(z=><option key={z.id} value={z.id}>{z.name} ({z.type})</option>)}
        </select>
      </div>
      <div className="fgrp full" style={{gap:8}}>
        <label className="tgl"><input type="checkbox" checked={f.isSingle} onChange={e=>s("isSingle",e.target.checked)}/> Vue isolée pour le visiteur</label>
        <label className="tgl"><input type="checkbox" checked={f.isDefault} onChange={e=>s("isDefault",e.target.checked)}/> Vue par défaut (accueil visiteur)</label>
      </div>
      <div className="fgrp full"><label className="fl">Couleur</label><div className="copts">{ZCOLS.map(c=><div key={c} className={`csw ${f.color===c?"on":""}`} style={{background:c}} onClick={()=>s("color",c)}/>)}</div></div>
      <div className="fgrp full">
        <label className="fl">Position & Taille sur le plan</label>
        <div style={{display:"flex",gap:7}}>
          {[["x","X"],["y","Y"],["w","L"],["h","H"]].map(([k,l])=>(
            <div key={k} style={{flex:1}}><div style={{fontSize:10,color:"var(--t3)",marginBottom:2}}>{l}</div>
              <input className="fi" type="number" value={f[k]} onChange={e=>s(k,+e.target.value)}/>
            </div>
          ))}
        </div>
      </div>
    </div></div>
    <div className="mdf"><button className="bs" onClick={onClose}>Annuler</button><button className="bp" onClick={()=>{if(f.name)onSave({...zone,...f});}}>{isN?"Créer":"Enregistrer"}</button></div>
  </div></div>);}

function EvM({iid,ev,onSave,onClose}){
  const isN=!ev.id;
  const[f,setF]=useState({title:ev.title||"",type:ev.type||"news",date:ev.date||new Date().toISOString().slice(0,10),desc:ev.desc||""});
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  return(<div className="mo"><div className="md" style={{maxWidth:460}}>
    <div className="mhd"><div className="mdt">{isN?"Nouvel événement":"Modifier"}</div><button className="ib" onClick={onClose}><Ic n="x" s={13}/></button></div>
    <div className="mdb"><div className="fg">
      <div className="fgrp full"><label className="fl">Titre *</label><input className="fi" value={f.title} onChange={e=>s("title",e.target.value)}/></div>
      <div className="fgrp"><label className="fl">Type</label><select className="fsl" value={f.type} onChange={e=>s("type",e.target.value)}>{ETYPES.map(t=><option key={t} value={t}>{ELBL[t]}</option>)}</select></div>
      <div className="fgrp"><label className="fl">Date</label><input className="fi" type="date" value={f.date} onChange={e=>s("date",e.target.value)}/></div>
      <div className="fgrp full"><label className="fl">Description</label><textarea className="fta" value={f.desc} onChange={e=>s("desc",e.target.value)}/></div>
    </div></div>
    <div className="mdf"><button className="bs" onClick={onClose}>Annuler</button><button className="bp" onClick={()=>{if(f.title)onSave(iid,{...ev,...f});}}>{isN?"Créer":"Enregistrer"}</button></div>
  </div></div>);}

function CM({msg,onConfirm,onClose}){return(
  <div className="mo"><div className="md" style={{maxWidth:370}}>
    <div className="mhd"><div className="mdt">Confirmation</div><button className="ib" onClick={onClose}><Ic n="x" s={13}/></button></div>
    <div className="mdb"><div style={{color:"var(--t2)",fontSize:13,lineHeight:1.6,marginBottom:5}}>{msg}</div><div style={{fontSize:11,color:"var(--t3)"}}>Cette action est irréversible.</div></div>
    <div className="mdf"><button className="bs" onClick={onClose}>Annuler</button><button className="bd" style={{padding:"7px 14px"}} onClick={onConfirm}><Ic n="del" s={12}/> Supprimer</button></div>
  </div></div>);}

ReactDOM.createRoot(document.getElementById("root")).render(<EB><App/></EB>);
</script>
</body>
</html>
