<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EXPOConnect — Salon Professionnel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#f5f2ee;--bg2:#ffffff;--bg3:#ece8e2;--card:#ffffff;
      --accent:#7a2035;--accent2:#9e2d47;--accent-dim:#7a203518;
      --text:#1e1a17;--text2:#6b5f57;--text3:#a0948c;
      --border:#e0d9d1;--border2:#cec5bb;
      --red:#c0392b;--green:#2d7a4f;--blue:#1a6fa8;
      --r:10px;--r2:16px;
      --shadow:0 2px 12px rgba(120,80,60,.08);
      --shadow-md:0 6px 28px rgba(120,80,60,.13);
      --shadow-lg:0 16px 56px rgba(120,80,60,.18);
    }
    html,body,#root{height:100%;background:var(--bg);}
    body{font-family:'DM Sans',sans-serif;color:var(--text);font-size:14px;overflow:hidden;}
    .app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    /* HEADER */
    .header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:62px;background:var(--bg2);border-bottom:1px solid var(--border);box-shadow:var(--shadow);flex-shrink:0;z-index:100;}
    .header-logo{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;letter-spacing:2px;color:var(--accent);}
    .header-logo span{color:var(--text3);font-weight:300;font-style:italic;}
    .header-nav{display:flex;gap:4px;}
    .nav-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .2s;}
    .nav-btn:hover{background:var(--bg3);color:var(--text);}
    .nav-btn.active{background:var(--accent-dim);color:var(--accent);}
    .header-right{display:flex;align-items:center;gap:10px;}
    .admin-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:500;border:1px solid #7a203530;}
    .btn-icon{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s;}
    .btn-icon:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
    /* MAIN */
    .main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
    .panel{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px;background:var(--bg);}
    .panel::-webkit-scrollbar{width:4px;}
    .panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
    /* SEARCH */
    .search-wrap{position:relative;margin-bottom:20px;}
    .search-input{width:100%;padding:11px 16px 11px 42px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:border .2s;box-shadow:var(--shadow);}
    .search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #7a203512;}
    .search-input::placeholder{color:var(--text3);}
    .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
    /* FILTERS */
    .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
    .filter-chip{padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
    .filter-chip:hover{border-color:var(--accent);color:var(--accent);}
    .filter-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:500;}
    /* STANDS GRID */
    .stands-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
    /* STAND CARD */
    .stand-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);cursor:pointer;transition:all .25s;overflow:hidden;box-shadow:var(--shadow);}
    .stand-card:hover{border-color:#7a203540;transform:translateY(-2px);box-shadow:var(--shadow-md);}
    .stand-card-accent{height:3px;}
    .stand-card-body{padding:18px;}
    .stand-card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
    .stand-emoji{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:10px;flex-shrink:0;border:1px solid var(--border);}
    .stand-card-meta{flex:1;min-width:0;}
    .stand-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:4px;}
    .stand-sector{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
    .stand-number{font-size:11px;color:var(--accent);font-weight:500;letter-spacing:1px;margin-top:2px;}
    .stand-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .stand-events-preview{display:flex;flex-wrap:wrap;gap:5px;}
    .event-tag{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:500;}
    .event-tag-dot{width:5px;height:5px;border-radius:50%;}
    /* DETAIL */
    .detail-panel{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);}
    .detail-panel::-webkit-scrollbar{width:4px;}
    .detail-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
    .detail-hero{padding:28px 28px 24px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;box-shadow:var(--shadow);}
    .detail-back{display:flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--text3);font-size:13px;cursor:pointer;margin-bottom:20px;font-family:'DM Sans',sans-serif;transition:color .2s;}
    .detail-back:hover{color:var(--accent);}
    .detail-header{display:flex;align-items:flex-start;gap:16px;}
    .detail-emoji{font-size:42px;width:68px;height:68px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:14px;flex-shrink:0;border:1px solid var(--border);}
    .detail-title{flex:1;}
    .detail-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1.1;color:var(--text);margin-bottom:8px;}
    .detail-chips{display:flex;flex-wrap:wrap;gap:6px;}
    .detail-chip{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;background:var(--bg3);color:var(--text2);border:1px solid var(--border2);}
    .detail-chip.accent{background:var(--accent-dim);color:var(--accent);border-color:#7a203530;}
    .detail-body{padding:26px 28px;flex:1;}
    .detail-section{margin-bottom:28px;}
    .detail-section-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:1px;color:var(--accent);text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #7a203520;}
    .detail-desc{color:var(--text2);line-height:1.75;font-size:14px;}
    .detail-contact{display:flex;flex-direction:column;gap:8px;}
    .contact-row{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;}
    .contact-row a{color:var(--accent);text-decoration:none;}
    .contact-row a:hover{text-decoration:underline;}
    /* EVENTS */
    .events-list{display:flex;flex-direction:column;gap:10px;}
    .event-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;border-left:3px solid;transition:all .2s;}
    .event-card:hover{background:var(--bg2);box-shadow:var(--shadow);}
    .event-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
    .event-type-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
    .event-date{font-size:11px;color:var(--text3);}
    .event-title{font-weight:500;color:var(--text);font-size:14px;margin-bottom:4px;}
    .event-desc{font-size:12px;color:var(--text2);line-height:1.5;}
    /* MAP VISITOR */
    .map-container{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .map-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:var(--shadow);}
    .map-toolbar-left{display:flex;align-items:center;gap:10px;}
    .map-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--accent);}
    .zoom-btns{display:flex;gap:4px;}
    .zoom-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:15px;}
    .zoom-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
    .map-hint{font-size:11px;color:var(--text3);}
    .map-svg-wrap{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:var(--bg3);}
    .map-svg-wrap:active{cursor:grabbing;}
    .map-legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);cursor:pointer;transition:color .15s;}
    .legend-item:hover{color:var(--accent);}
    .legend-dot{width:10px;height:10px;border-radius:2px;}
    /* AGENDA */
    .agenda-day{margin-bottom:28px;}
    .agenda-day-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #7a203520;}
    .agenda-event-row{display:flex;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;transition:all .2s;cursor:pointer;box-shadow:var(--shadow);}
    .agenda-event-row:hover{border-color:var(--border2);box-shadow:var(--shadow-md);transform:translateX(2px);}
    .agenda-event-bar{width:3px;border-radius:2px;flex-shrink:0;}
    .agenda-event-content{flex:1;}
    .agenda-event-stand{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;}
    .agenda-event-title{font-weight:500;color:var(--text);margin-bottom:3px;}
    .agenda-event-type{font-size:11px;padding:2px 7px;border-radius:4px;display:inline-block;}
    /* ADMIN */
    .admin-layout{flex:1;display:flex;overflow:hidden;}
    .admin-sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:2px 0 8px rgba(120,80,60,.05);}
    .admin-sidebar-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:4px 10px 12px;}
    .sidebar-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;text-align:left;transition:all .2s;width:100%;}
    .sidebar-item:hover{background:var(--bg3);color:var(--text);}
    .sidebar-item.active{background:var(--accent-dim);color:var(--accent);}
    .admin-content{flex:1;overflow-y:auto;padding:24px;background:var(--bg);}
    .admin-content::-webkit-scrollbar{width:4px;}
    .admin-content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
    .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
    .admin-page-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--text);}
    /* BUTTONS */
    .btn-primary{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px #7a203530;}
    .btn-primary:hover{background:var(--accent2);box-shadow:0 4px 16px #7a203540;}
    .btn-secondary{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
    .btn-secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
    .btn-danger{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:1px solid #c0392b30;background:transparent;color:var(--red);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
    .btn-danger:hover{background:#c0392b10;border-color:var(--red);}
    /* TABLE */
    .data-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);}
    .data-table th{text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);border-bottom:1px solid var(--border);font-weight:500;background:var(--bg3);}
    .data-table td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .data-table tr:last-child td{border-bottom:none;}
    .data-table tr:hover td{background:#f5f2ee;}
    .table-actions{display:flex;gap:6px;}
    /* MODAL */
    .modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(30,20,15,.45);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px);}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
    .modal::-webkit-scrollbar{width:4px;}
    .modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1;}
    .modal-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--text);}
    .modal-body{padding:24px;}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg2);}
    /* FORM */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group.full{grid-column:1/-1;}
    .form-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:500;}
    .form-input,.form-select,.form-textarea{padding:9px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;transition:border .2s;}
    .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #7a203510;}
    .form-textarea{resize:vertical;min-height:80px;}
    .form-select option{background:var(--bg2);color:var(--text);}
    /* LOGIN */
    .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
    .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:44px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);}
    .login-logo{text-align:center;margin-bottom:32px;}
    .login-logo-text{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--accent);letter-spacing:2px;}
    .login-subtitle{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:2.5px;margin-top:5px;}
    .login-divider{height:1px;background:var(--border);margin:4px 0 8px;}
    .login-form{display:flex;flex-direction:column;gap:16px;}
    .login-error{background:#c0392b0f;border:1px solid #c0392b30;border-radius:7px;padding:10px 14px;font-size:13px;color:var(--red);}
    /* STATS */
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:22px;text-align:center;box-shadow:var(--shadow);transition:box-shadow .2s;}
    .stat-card:hover{box-shadow:var(--shadow-md);}
    .stat-value{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;color:var(--accent);line-height:1;}
    .stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:6px;}
    /* COLORS */
    .color-options{display:flex;gap:8px;flex-wrap:wrap;}
    .color-swatch{width:28px;height:28px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
    .color-swatch.selected{border-color:var(--accent);transform:scale(1.18);}
    /* EMPTY */
    .empty-state{text-align:center;padding:60px 20px;}
    .empty-state-icon{font-size:40px;margin-bottom:12px;}
    .empty-state-text{font-size:14px;color:var(--text2);}
    .divider{height:1px;background:var(--border);margin:0 0 20px;}
    /* TOAST */
    .toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--accent);border-radius:10px;padding:12px 20px;color:#fff;font-size:13px;font-weight:500;box-shadow:0 8px 28px #7a203540;animation:slideUp .3s ease;}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}

    /* ══════════════════════════════════════════════════════
       PLAN EDITOR  (3 colonnes : liste | canvas | props)
    ══════════════════════════════════════════════════════ */
    .editor-layout{flex:1;display:flex;overflow:hidden;background:var(--bg);}

    /* Colonne gauche – liste des stands */
    .editor-list{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
    .editor-list-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .editor-list-title{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);font-weight:500;}
    .editor-list-body{flex:1;overflow-y:auto;padding:8px;}
    .editor-list-body::-webkit-scrollbar{width:3px;}
    .editor-list-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
    .editor-stand-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent;}
    .editor-stand-row:hover{background:var(--bg3);}
    .editor-stand-row.selected{background:var(--accent-dim);border-color:#7a203530;}
    .editor-stand-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
    .editor-stand-info{flex:1;min-width:0;}
    .editor-stand-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .editor-stand-num{font-size:10px;color:var(--text3);}

    /* Colonne centre – canvas SVG */
    .editor-canvas-col{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .editor-toolbar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
    .editor-toolbar-sep{width:1px;height:22px;background:var(--border2);margin:0 4px;}
    .tool-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .18s;white-space:nowrap;}
    .tool-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
    .tool-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
    .tool-btn:disabled{opacity:.4;cursor:not-allowed;}
    .editor-canvas-wrap{flex:1;overflow:hidden;position:relative;background:var(--bg3);}
    .editor-statusbar{padding:5px 14px;background:var(--bg2);border-top:1px solid var(--border);font-size:11px;color:var(--text3);display:flex;gap:20px;flex-shrink:0;}

    /* Colonne droite – propriétés */
    .editor-props{width:280px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

    .snap-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text2);}
    .snap-toggle input{accent-color:var(--accent);width:14px;height:14px;}
    .halls-list{display:flex;flex-direction:column;gap:6px;}
    .hall-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;}
    .hall-color{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
    .hall-name{flex:1;font-size:13px;font-weight:500;color:var(--text);}
    .hall-count{font-size:11px;color:var(--text3);}
    .no-selection{text-align:center;padding:30px 16px;color:var(--text3);}
    .no-selection-icon{font-size:28px;margin-bottom:8px;}
    .no-selection-text{font-size:12px;line-height:1.6;}

    /* Context menu */
    .ctx-menu{position:fixed;z-index:500;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow-md);min-width:160px;padding:5px;}
    .ctx-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;}
    .ctx-item:hover{background:var(--bg3);color:var(--text);}
    .ctx-item.danger{color:var(--red);}
    .ctx-item.danger:hover{background:#c0392b0f;}
    .ctx-sep{height:1px;background:var(--border);margin:4px 0;}

    @media(max-width:600px){
      .header{padding:0 12px;}
      .header-logo{font-size:17px;}
      .nav-btn span.nav-label{display:none;}

      .form-grid{grid-template-columns:1fr;}
      .form-group.full{grid-column:1;}
      .stats-grid{grid-template-columns:repeat(3,1fr);}
    }
  </style>
</head>

const fmtDate=d=>{if(!d)return"";const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});};
const hexRgba=(hex,a)=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;};
const snap=(v,g)=>g>0?Math.round(v/g)*g:v;
const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));

/* ── ICONS ── */

/* ══════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════ */
function App(){
  const [stands,setStands]=useState(INITIAL_STANDS);
  const [halls,setHalls]=useState(INITIAL_HALLS);
  const [view,setView]=useState("stands");
  const [selectedStand,setSelectedStand]=useState(null);
  const [isAdmin,setIsAdmin]=useState(false);
  const [showLogin,setShowLogin]=useState(false);
  const [search,setSearch]=useState("");
  const [filterSector,setFilterSector]=useState("Tous");
  const [toast,setToast]=useState(null);
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2500);};
  const goStand=id=>{setSelectedStand(id);setView("stands");};
  const sectors=["Tous",...Array.from(new Set(stands.map(s=>s.sector)))];
  const filtered=stands.filter(s=>{
    const q=search.toLowerCase();
    return(!q||s.name.toLowerCase().includes(q)||s.sector.toLowerCase().includes(q)||s.number.toLowerCase().includes(q))
      &&(filterSector==="Tous"||s.sector===filterSector);
  });
  return(
    <div className="app">
      <Header view={view} setView={v=>{setView(v);setSelectedStand(null);}} isAdmin={isAdmin} setIsAdmin={setIsAdmin} setShowLogin={setShowLogin}/>
      <div className="main">
        {view==="stands"&&!selectedStand&&(
          <div className="panel">
            <div className="search-wrap"><span className="search-icon"><Icon name="search" size={15}/></span><input className="search-input" placeholder="Rechercher un stand, secteur…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
            <div className="filter-row">{sectors.map(s=><button key={s} className={`filter-chip ${filterSector===s?"active":""}`} onClick={()=>setFilterSector(s)}>{s}</button>)}</div>
            {filtered.length===0?<div className="empty-state"><div className="empty-state-icon">🔍</div><div className="empty-state-text">Aucun stand trouvé</div></div>
              :<div className="stands-grid">{filtered.map(s=><StandCard key={s.id} stand={s} onClick={()=>setSelectedStand(s.id)}/>)}</div>}
          </div>
        )}
        {view==="stands"&&selectedStand&&<StandDetail stand={stands.find(s=>s.id===selectedStand)} onBack={()=>setSelectedStand(null)}/>}
        {view==="map"&&<MapView stands={stands} halls={halls} onStandClick={goStand}/>}
        {view==="agenda"&&<div className="panel"><AgendaView stands={stands} onStandClick={goStand}/></div>}
        {view==="admin"&&(isAdmin
          ?<AdminPanel stands={stands} setStands={setStands} halls={halls} setHalls={setHalls} showToast={showToast}/>
          :<div className="login-wrap"><LoginCard onLogin={(l,p)=>{if(l===ADMIN_CREDS.login&&p===ADMIN_CREDS.password){setIsAdmin(true);return true;}return false;}}/></div>
        )}
      </div>
      {toast&&<div className="toast">{toast}</div>}
      {showLogin&&!isAdmin&&(
        <div className="modal-overlay" onClick={()=>setShowLogin(false)}>
          <div onClick={e=>e.stopPropagation()}>
            <LoginCard onLogin={(l,p)=>{if(l===ADMIN_CREDS.login&&p===ADMIN_CREDS.password){setIsAdmin(true);setShowLogin(false);setView("admin");return true;}return false;}}/>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── HEADER ── */
function Header({view,setView,isAdmin,setIsAdmin,setShowLogin}){
  return(
    <header className="header">
      <div className="header-logo">EXPO<span>Connect</span></div>
      <nav className="header-nav">
        <button className={`nav-btn ${view==="stands"?"active":""}`} onClick={()=>setView("stands")}><Icon name="list" size={14}/> <span className="nav-label">Stands</span></button>
        <button className={`nav-btn ${view==="map"?"active":""}`} onClick={()=>setView("map")}><Icon name="map" size={14}/> <span className="nav-label">Plan</span></button>
        <button className={`nav-btn ${view==="agenda"?"active":""}`} onClick={()=>setView("agenda")}><Icon name="calendar" size={14}/> <span className="nav-label">Agenda</span></button>
      </nav>
      <div className="header-right">
        {isAdmin?(
          <>
            <button className={`nav-btn ${view==="admin"?"active":""}`} onClick={()=>setView("admin")}><Icon name="admin" size={14}/> <span className="nav-label">Admin</span></button>
            <div className="admin-badge"><Icon name="admin" size={12}/> Administrateur</div>
            <button className="btn-icon" title="Déconnexion" onClick={()=>{setIsAdmin(false);setView("stands");}}><Icon name="logout" size={15}/></button>
          </>
        ):(
          <button className="btn-icon" title="Espace admin" onClick={()=>setShowLogin(true)}><Icon name="admin" size={15}/></button>
        )}
      </div>
    </header>
  );
}

/* ── STAND CARD ── */
function StandCard({stand,onClick}){
  return(
    <div className="stand-card" onClick={onClick}>
      <div className="stand-card-accent" style={{background:stand.color}}/>
      <div className="stand-card-body">
        <div className="stand-card-header">
          <div className="stand-emoji">{stand.logo}</div>
          <div className="stand-card-meta">
            <div className="stand-name">{stand.name}</div>
            <div className="stand-sector">{stand.sector}</div>
            <div className="stand-number">Stand {stand.number}</div>
          </div>
        </div>
        <div className="stand-desc">{stand.description}</div>
        {stand.events.length>0&&(
          <div className="stand-events-preview">
            {stand.events.slice(0,3).map(ev=>(
              <span key={ev.id} className="event-tag" style={{background:hexRgba(EVENT_COLORS[ev.type]||"#1a6fa8",.1),color:EVENT_COLORS[ev.type]||"#1a6fa8"}}>
                <span className="event-tag-dot" style={{background:EVENT_COLORS[ev.type]}}/>
                {EVENT_LABELS[ev.type]}
              </span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── STAND DETAIL ── */
function StandDetail({stand,onBack}){
  if(!stand)return null;
  return(
    <div className="detail-panel">
      <div className="detail-hero">
        <button className="detail-back" onClick={onBack}><Icon name="back" size={14}/> Retour aux stands</button>
        <div className="detail-header">
          <div className="detail-emoji">{stand.logo}</div>
          <div className="detail-title">
            <div className="detail-name">{stand.name}</div>
            <div className="detail-chips">
              <span className="detail-chip accent">Stand {stand.number}</span>
              <span className="detail-chip">{stand.sector}</span>
              <span className="detail-chip">Hall {stand.hall}</span>
            </div>
          </div>
        </div>
      </div>
      <div className="detail-body">
        <div className="detail-section"><div className="detail-section-title">À propos</div><div className="detail-desc">{stand.description}</div></div>
        <div className="detail-section">
          <div className="detail-section-title">Contact</div>
          <div className="detail-contact">
            <div className="contact-row">✉️ <a href={`mailto:${stand.contact}`}>{stand.contact}</a></div>
            <div className="contact-row">🌐 <a href={`https://${stand.website}`} target="_blank" rel="noreferrer">{stand.website}</a></div>
          </div>
        </div>
        {stand.events.length>0&&(
          <div className="detail-section">
            <div className="detail-section-title">Actualités & Agenda</div>
            <div className="events-list">
              {stand.events.map(ev=>{
                const color=EVENT_COLORS[ev.type]||"#1a6fa8";
                return(
                  <div key={ev.id} className="event-card" style={{borderLeftColor:color}}>
                    <div className="event-card-header">
                      <span className="event-type-badge" style={{background:hexRgba(color,.12),color}}>{EVENT_LABELS[ev.type]}</span>
                      <span className="event-date">{fmtDate(ev.date)}</span>
                    </div>
                    <div className="event-title">{ev.title}</div>
                    <div className="event-desc">{ev.desc}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── MAP VISITOR ── */
function MapView({stands,halls,onStandClick}){
  const wrapRef=useRef(null);
  const [tr,setTr]=useState({x:0,y:0,scale:1});
  const [hov,setHov]=useState(null);
  const drag=useRef(null);const pinch=useRef(null);
  const clampS=s=>Math.min(4,Math.max(0.3,s));
  const onWheel=useCallback(e=>{e.preventDefault();setTr(t=>({...t,scale:clampS(t.scale*(e.deltaY>0?.9:1.1))}));},[]);
  useEffect(()=>{const el=wrapRef.current;if(!el)return;el.addEventListener("wheel",onWheel,{passive:false});return()=>el.removeEventListener("wheel",onWheel);},[onWheel]);
  const onMD=e=>{drag.current={sx:e.clientX-tr.x,sy:e.clientY-tr.y};};
  const onMM=e=>{if(!drag.current)return;setTr(t=>({...t,x:e.clientX-drag.current.sx,y:e.clientY-drag.current.sy}));};
  const onMU=()=>{drag.current=null;};
  const onTS=e=>{if(e.touches.length===1){drag.current={sx:e.touches[0].clientX-tr.x,sy:e.touches[0].clientY-tr.y};}else if(e.touches.length===2){drag.current=null;const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinch.current={dist:Math.sqrt(dx*dx+dy*dy),scale:tr.scale};}};
  const onTM=e=>{e.preventDefault();if(e.touches.length===1&&drag.current){setTr(t=>({...t,x:e.touches[0].clientX-drag.current.sx,y:e.touches[0].clientY-drag.current.sy}));}else if(e.touches.length===2&&pinch.current){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;setTr(t=>({...t,scale:clampS(pinch.current.scale*(Math.sqrt(dx*dx+dy*dy)/pinch.current.dist))}));}};
  const onTE=()=>{drag.current=null;pinch.current=null;};
  const zoom=d=>setTr(t=>({...t,scale:clampS(t.scale*(d>0?1.25:.8))}));
  const reset=()=>setTr({x:0,y:0,scale:1});
  return(
    <div className="map-container">
      <div className="map-toolbar">
        <div className="map-toolbar-left">
          <div className="map-title">Plan du salon</div>
          <div className="zoom-btns">
            <button className="zoom-btn" onClick={()=>zoom(1)}>＋</button>
            <button className="zoom-btn" onClick={()=>zoom(-1)}>－</button>
            <button className="zoom-btn" onClick={reset}>⊙</button>
          </div>
        </div>
        <div className="map-hint">🤏 Pinch pour zoomer · Glisser pour naviguer</div>
      </div>
      <div className="map-svg-wrap" ref={wrapRef} onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU} onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
        <CanvasSVG stands={stands} halls={halls} scale={tr.scale} offsetX={tr.x} offsetY={tr.y}
          hov={hov} setHov={setHov} onClickStand={onStandClick} readOnly={true}/>
      </div>
      <div className="map-legend">{stands.map(s=><div key={s.id} className="legend-item" onClick={()=>onStandClick(s.id)}><div className="legend-dot" style={{background:s.color}}/><span>{s.number} – {s.name}</span></div>)}</div>
    </div>
  );
}

/* ── SHARED SVG CANVAS ── */
function CanvasSVG({stands,halls,scale,offsetX,offsetY,hov,setHov,onClickStand,
  readOnly,selectedId,onSelectStand,drawMode,onDrawStart,
  resizeHandle,onResizeStart,showGrid,gridSize}){
  const transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`;
  const gSize=gridSize||20;
  return(
    <svg width={CANVAS_W} height={CANVAS_H}
      style={{transform,transformOrigin:"0 0",display:"block",userSelect:"none"}}
      onMouseDown={drawMode&&!readOnly?onDrawStart:undefined}>
      {/* Fond */}
      <rect width={CANVAS_W} height={CANVAS_H} fill="#ece8e2"/>
      {/* Grille */}
      {showGrid&&(
        <g opacity="0.35">
          {Array.from({length:Math.ceil(CANVAS_W/gSize)+1},(_,i)=><line key={"v"+i} x1={i*gSize} y1={0} x2={i*gSize} y2={CANVAS_H} stroke="#c0b8b0" strokeWidth="0.5"/>)}
          {Array.from({length:Math.ceil(CANVAS_H/gSize)+1},(_,i)=><line key={"h"+i} x1={0} y1={i*gSize} x2={CANVAS_W} y2={i*gSize} stroke="#c0b8b0" strokeWidth="0.5"/>)}
        </g>
      )}
      {/* Halls */}
      {halls.map(h=>(
        <g key={h.id}>
          <rect x={h.x} y={h.y} width={h.w} height={h.h} fill={h.color} stroke={h.border} strokeWidth="1" rx="8" strokeDasharray="5,3" opacity="0.7"/>
          <text x={h.x+10} y={h.y+20} fill={h.border} fontSize="13" fontWeight="700" fontFamily="Cormorant Garamond" opacity="0.6">{h.name}</text>
        </g>
      ))}
      {/* Entrée */}
      <rect x={CANVAS_W/2-55} y={CANVAS_H-46} width="110" height="30" rx="5" fill="#7a203520" stroke="#7a203550"/>
      <text x={CANVAS_W/2} y={CANVAS_H-25} fill="#7a2035" fontSize="11" textAnchor="middle" fontFamily="DM Sans" fontWeight="500">ENTRÉE</text>
      <polygon points={`${CANVAS_W/2-10},${CANVAS_H-47} ${CANVAS_W/2+10},${CANVAS_H-47} ${CANVAS_W/2},${CANVAS_H-57}`} fill="#7a203580"/>
      {/* Stands */}
      {stands.map(s=>{
        const isH=hov===s.id,isSel=selectedId===s.id;
        return(
          <g key={s.id} style={{cursor:readOnly?"pointer":drawMode?"crosshair":"move"}}
            onClick={e=>{e.stopPropagation();readOnly?onClickStand&&onClickStand(s.id):onSelectStand&&onSelectStand(s.id,e);}}
            onMouseEnter={()=>setHov&&setHov(s.id)} onMouseLeave={()=>setHov&&setHov(null)}
            onMouseDown={!readOnly&&!drawMode?e=>{e.stopPropagation();}:undefined}>
            <rect x={s.x} y={s.y} width={s.w} height={s.h} rx="6"
              fill={isSel?hexRgba(s.color,.28):isH?hexRgba(s.color,.2):hexRgba(s.color,.1)}
              stroke={isSel?"#7a2035":s.color} strokeWidth={isSel?2.5:isH?2:1.5}/>
            {isSel&&<rect x={s.x-2} y={s.y-2} width={s.w+4} height={s.h+4} rx="8" fill="none" stroke="#7a2035" strokeWidth="1" strokeDasharray="4,3" opacity="0.6"/>}
            <text x={s.x+s.w/2} y={s.y+22} textAnchor="middle" fill={s.color} fontSize="16" fontFamily="DM Sans">{s.logo}</text>
            <text x={s.x+s.w/2} y={s.y+37} textAnchor="middle" fill={isSel||isH?"#1e1a17":"#6b5f57"} fontSize="9" fontFamily="DM Sans" fontWeight="500">{s.name.length>14?s.name.slice(0,14)+"…":s.name}</text>
            <text x={s.x+s.w/2} y={s.y+49} textAnchor="middle" fill={s.color} fontSize="8" fontFamily="DM Sans">{s.number}</text>
            {s.events.length>0&&<circle cx={s.x+s.w-8} cy={s.y+8} r="5" fill="#7a2035"/>}
            {/* Resize handles — 8 poignées */}
            {isSel&&!readOnly&&[
              {hx:s.x,hy:s.y,c:"nw"},{hx:s.x+s.w/2,hy:s.y,c:"n"},{hx:s.x+s.w,hy:s.y,c:"ne"},
              {hx:s.x+s.w,hy:s.y+s.h/2,c:"e"},{hx:s.x+s.w,hy:s.y+s.h,c:"se"},
              {hx:s.x+s.w/2,hy:s.y+s.h,c:"s"},{hx:s.x,hy:s.y+s.h,c:"sw"},{hx:s.x,hy:s.y+s.h/2,c:"w"}
            ].map(({hx,hy,c})=>(
              <rect key={c} x={hx-5} y={hy-5} width="10" height="10" rx="2"
                fill="#fff" stroke="#7a2035" strokeWidth="1.5"
                style={{cursor:`${c}-resize`}}
                onMouseDown={e=>{e.stopPropagation();onResizeStart&&onResizeStart(s.id,c,e);}}/>
            ))}
          </g>
        );
      })}
      {/* Tooltip visiteur */}
      {hov&&readOnly&&(()=>{
        const s=stands.find(x=>x.id===hov);if(!s)return null;
        const tx=Math.min(s.x+s.w/2,CANVAS_W-70),ty=Math.max(4,s.y-50);
        return(<g>
          <rect x={tx-64} y={ty} width="128" height="38" rx="6" fill="#fff" stroke="#e0d9d1" style={{filter:"drop-shadow(0 2px 6px rgba(120,80,60,.15))"}}/>
          <text x={tx} y={ty+14} textAnchor="middle" fill="#1e1a17" fontSize="10" fontFamily="DM Sans" fontWeight="500">{s.name}</text>
          <text x={tx} y={ty+28} textAnchor="middle" fill="#6b5f57" fontSize="9" fontFamily="DM Sans">{s.sector}</text>
        </g>);
      })()}
    </svg>
  );
}

/* ── AGENDA ── */
function AgendaView({stands,onStandClick}){
  const all=stands.flatMap(s=>s.events.map(ev=>({...ev,standName:s.name,standId:s.id,standColor:s.color})));
  all.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const byDate={};
  all.forEach(ev=>{const d=ev.date||"Sans date";if(!byDate[d])byDate[d]=[];byDate[d].push(ev);});
  if(!Object.keys(byDate).length)return<div className="empty-state"><div className="empty-state-icon">📅</div><div className="empty-state-text">Aucun événement à venir</div></div>;
  return(<>{Object.entries(byDate).map(([date,evs])=>(
    <div key={date} className="agenda-day">
      <div className="agenda-day-title">{date==="Sans date"?"Sans date":fmtDate(date)}</div>
      {evs.map((ev,i)=>{
        const color=EVENT_COLORS[ev.type]||"#1a6fa8";
        return(<div key={i} className="agenda-event-row" onClick={()=>onStandClick(ev.standId)}>
          <div className="agenda-event-bar" style={{background:ev.standColor}}/>
          <div className="agenda-event-content">

            <div className="agenda-event-title">{ev.title}</div>
            <span className="agenda-event-type" style={{background:hexRgba(color,.1),color}}>{EVENT_LABELS[ev.type]}</span>
          </div>
        </div>);
      })}
    </div>
  ))}</>);
}

/* ══════════════════════════════════════════
   PLAN EDITOR  ← pièce maîtresse
══════════════════════════════════════════ */
function PlanEditor({stands,setStands,halls,setHalls,showToast}){
  const canvasRef=useRef(null);
  const [selectedId,setSelectedId]=useState(null);
  const [tool,setTool]=useState("select"); // select | draw
  const [snap,setSnapEnabled]=useState(true);
  const [gridSize,setGridSize]=useState(20);
  const [showGrid,setShowGrid]=useState(true);
  const [zoom,setZoom]=useState(1);
  const [offset,setOffset]=useState({x:20,y:20});
  const [status,setStatus]=useState("Prêt");
  const [history,setHistory]=useState([stands]);
  const [histIdx,setHistIdx]=useState(0);
  const [ctxMenu,setCtxMenu]=useState(null); // {x,y,standId}
  const [drawing,setDrawing]=useState(null); // {sx,sy,ex,ey}
  const [editStandModal,setEditStandModal]=useState(null);
  const [confirm,setConfirm]=useState(null);
  // drag/resize state
  const dragRef=useRef(null);
  const resizeRef=useRef(null);
  const panRef=useRef(null);
  const clampZ=z=>Math.min(3,Math.max(0.3,z));

  const selectedStand=stands.find(s=>s.id===selectedId)||null;

  // Push to history
  const pushHistory=useCallback(newStands=>{
    setHistory(h=>{const next=h.slice(0,histIdx+1);next.push(newStands);return next;});
    setHistIdx(i=>i+1);
  },[histIdx]);

  const undo=()=>{if(histIdx>0){const ni=histIdx-1;setStands(history[ni]);setHistIdx(ni);showToast("Annulé");}};
  const redo=()=>{if(histIdx<history.length-1){const ni=histIdx+1;setStands(history[ni]);setHistIdx(ni);showToast("Rétabli");}};

  // SVG coords from mouse event
  const svgCoords=useCallback(e=>{
    const rect=canvasRef.current?.getBoundingClientRect();
    if(!rect)return{x:0,y:0};
    return{x:(e.clientX-rect.left-offset.x)/zoom,y:(e.clientY-rect.top-offset.y)/zoom};
  },[offset,zoom]);

  const snapV=v=>snap?Math.round(v/gridSize)*gridSize:v;

  // Update stand geometry & push history
  const updateStandGeo=(id,patch)=>{
    setStands(prev=>{
      const next=prev.map(s=>s.id===id?{...s,...patch}:s);
      pushHistory(next);
      return next;
    });
  };

  // Wheel zoom on canvas
  const onCanvasWheel=useCallback(e=>{
    e.preventDefault();
    const factor=e.deltaY<0?1.1:0.9;
    setZoom(z=>clampZ(z*factor));
  },[]);
  useEffect(()=>{
    const el=canvasRef.current;if(!el)return;
    el.addEventListener("wheel",onCanvasWheel,{passive:false});
    return()=>el.removeEventListener("wheel",onCanvasWheel);
  },[onCanvasWheel]);

  // Mouse down on canvas background → pan or start draw
  const onCanvasMouseDown=e=>{
    if(e.button===1||(e.button===0&&tool==="select"&&!e.target.closest("[data-stand]"))){
      // Pan
      panRef.current={sx:e.clientX-offset.x,sy:e.clientY-offset.y};
      setStatus("Déplacement du plan…");
    }
    if(tool==="draw"&&e.button===0){
      const c=svgCoords(e);
      setDrawing({sx:snapV(c.x),sy:snapV(c.y),ex:snapV(c.x),ey:snapV(c.y)});
    }
    // Deselect
    if(tool==="select"){setSelectedId(null);}
    setCtxMenu(null);
  };

  const onMouseMove=useCallback(e=>{
    if(panRef.current){
      setOffset({x:e.clientX-panRef.current.sx,y:e.clientY-panRef.current.sy});
      return;
    }
    if(dragRef.current){
      const {id,ox,oy}=dragRef.current;
      const c=svgCoords(e);
      const nx=snapV(c.x-ox),ny=snapV(c.y-oy);
      setStands(prev=>prev.map(s=>s.id===id?{...s,x:Math.max(0,nx),y:Math.max(0,ny)}:s));
      setStatus(`Position : X=${Math.round(nx)} Y=${Math.round(ny)}`);
      return;
    }
    if(resizeRef.current){
      const {id,handle,ox,oy,sx,sy,sw,sh}=resizeRef.current;
      const c=svgCoords(e);
      const dx=snapV(c.x)-snapV(ox),dy=snapV(c.y)-snapV(oy);
      let nx=sx,ny=sy,nw=sw,nh=sh;
      if(handle.includes("e"))nw=Math.max(40,sw+dx);
      if(handle.includes("s"))nh=Math.max(30,sh+dy);
      if(handle.includes("w")){nw=Math.max(40,sw-dx);nx=sx+dx;}
      if(handle.includes("n")){nh=Math.max(30,sh-dy);ny=sy+dy;}
      setStands(prev=>prev.map(s=>s.id===id?{...s,x:snapV(nx),y:snapV(ny),w:snapV(nw),h:snapV(nh)}:s));
      setStatus(`Taille : L=${Math.round(nw)} H=${Math.round(nh)}`);
      return;
    }
    if(drawing){
      const c=svgCoords(e);
      setDrawing(d=>({...d,ex:snapV(c.x),ey:snapV(c.y)}));
    }
  },[svgCoords,dragRef,resizeRef,panRef,drawing,snapV]);

  const onMouseUp=useCallback(e=>{
    if(panRef.current){panRef.current=null;setStatus("Prêt");}
    if(dragRef.current){
      const s=stands.find(x=>x.id===dragRef.current.id);
      if(s)pushHistory(stands);
      dragRef.current=null;setStatus("Prêt");
    }
    if(resizeRef.current){
      pushHistory(stands);
      resizeRef.current=null;setStatus("Prêt");
    }
    if(drawing){
      const {sx,sy,ex,ey}=drawing;
      const x=Math.min(sx,ex),y=Math.min(sy,ey),w=Math.abs(ex-sx),h=Math.abs(ey-sy);
      if(w>20&&h>20){
        const nid=Math.max(0,...stands.map(s=>s.id))+1;
        const ns={id:nid,name:`Stand ${nid}`,number:`X${nid}`,hall:"A",x:snapV(x),y:snapV(y),w:snapV(w),h:snapV(h),sector:SECTORS[0],description:"",contact:"",website:"",logo:"🏢",color:STAND_COLORS[nid%STAND_COLORS.length],events:[]};
        const next=[...stands,ns];
        setStands(next);pushHistory(next);
        setSelectedId(nid);setTool("select");
        setEditStandModal(ns);
        showToast("Stand créé — renseignez ses informations");
      }
      setDrawing(null);
    }
  },[stands,drawing,pushHistory,snapV,showToast]);

  // Stand drag start
  const onStandMouseDown=useCallback((id,e)=>{
    if(tool!=="select")return;
    e.stopPropagation();
    const c=svgCoords(e);
    const s=stands.find(x=>x.id===id);
    if(!s)return;
    dragRef.current={id,ox:c.x-s.x,oy:c.y-s.y};
    setSelectedId(id);
    setStatus(`Déplacement de ${s.name}…`);
  },[tool,svgCoords,stands]);

  // Resize start
  const onResizeStart=useCallback((id,handle,e)=>{
    e.stopPropagation();
    const c=svgCoords(e);
    const s=stands.find(x=>x.id===id);
    if(!s)return;
    resizeRef.current={id,handle,ox:c.x,oy:c.y,sx:s.x,sy:s.y,sw:s.w,sh:s.h};
    setStatus(`Redimensionnement…`);
  },[svgCoords,stands]);

  // Right click
  const onStandContextMenu=useCallback((id,e)=>{
    e.preventDefault();e.stopPropagation();
    setSelectedId(id);
    setCtxMenu({x:e.clientX,y:e.clientY,standId:id});
  },[]);

  // Duplicate
  const duplicateStand=id=>{
    const s=stands.find(x=>x.id===id);if(!s)return;
    const nid=Math.max(0,...stands.map(x=>x.id))+1;
    const ns={...s,id:nid,name:s.name+" (copie)",x:s.x+20,y:s.y+20,events:[]};
    const next=[...stands,ns];setStands(next);pushHistory(next);
    setSelectedId(nid);showToast("Stand dupliqué");
  };

  // Delete stand from editor
  const deleteStandEditor=id=>{
    setConfirm({msg:"Supprimer ce stand du plan ?",onConfirm:()=>{
      const next=stands.filter(s=>s.id!==id);setStands(next);pushHistory(next);
      setSelectedId(null);setConfirm(null);showToast("Stand supprimé");
    }});
  };

  // Alignment helpers
  const align=mode=>{
    if(!selectedStand)return;
    let patch={};
    if(mode==="left")patch={x:0};
    if(mode==="right")patch={x:CANVAS_W-selectedStand.w};
    if(mode==="top")patch={y:0};
    if(mode==="bottom")patch={y:CANVAS_H-selectedStand.h};
    if(mode==="cx")patch={x:Math.round((CANVAS_W-selectedStand.w)/2)};
    if(mode==="cy")patch={y:Math.round((CANVAS_H-selectedStand.h)/2)};
    updateStandGeo(selectedStand.id,patch);showToast("Alignement appliqué");
  };

  // Property update (right panel)
  const updateProp=(k,v)=>{
    if(!selectedStand)return;
    const numKeys=["x","y","w","h"];
    const val=numKeys.includes(k)?Number(v):v;
    setStands(prev=>prev.map(s=>s.id===selectedStand.id?{...s,[k]:val}:s));
  };
  const commitProp=()=>pushHistory(stands);

  // save = just toast (data lives in React state shared with rest of app)
  const saveMap=()=>showToast("Plan enregistré ✓");

  const cursorStyle=tool==="draw"?"crosshair":"default";

  return(
    <div className="editor-layout" onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}>
      {/* ── Colonne gauche : liste ── */}
      <div className="editor-list">
        <div className="editor-list-header">
          <div className="editor-list-title">Stands ({stands.length})</div>
          <button className="tool-btn" style={{padding:"4px 8px"}} onClick={()=>setTool("draw")} title="Dessiner un nouveau stand">
            <Icon name="plus" size={13}/>
          </button>
        </div>
        <div className="editor-list-body">
          {stands.map(s=>(
            <div key={s.id} className={`editor-stand-row ${selectedId===s.id?"selected":""}`}
              onClick={()=>{setSelectedId(s.id);setTool("select");}}
              onContextMenu={e=>onStandContextMenu(s.id,e)}>
              <div className="editor-stand-dot" style={{background:s.color}}/>
              <div className="editor-stand-info">
                <div className="editor-stand-name">{s.logo} {s.name}</div>
                <div className="editor-stand-num">Stand {s.number} · Hall {s.hall}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Colonne centre : canvas ── */}
      <div className="editor-canvas-col">
        {/* Barre d'outils */}
        <div className="editor-toolbar">
          <button className={`tool-btn ${tool==="select"?"active":""}`} onClick={()=>setTool("select")} title="Sélectionner / Déplacer (S)">
            <Icon name="move" size={14}/> Sélection
          </button>
          <button className={`tool-btn ${tool==="draw"?"active":""}`} onClick={()=>setTool("draw")} title="Dessiner un nouveau stand (D)">
            <Icon name="add_rect" size={14}/> Nouveau stand
          </button>
          <div className="editor-toolbar-sep"/>
          <button className="tool-btn" onClick={undo} disabled={histIdx===0} title="Annuler (Ctrl+Z)"><Icon name="undo" size={14}/> Annuler</button>
          <button className="tool-btn" onClick={redo} disabled={histIdx>=history.length-1} title="Rétablir (Ctrl+Y)"><Icon name="redo" size={14}/> Rétablir</button>
          <div className="editor-toolbar-sep"/>
          <button className="tool-btn" onClick={()=>setZoom(z=>clampZ(z*1.25))} title="Zoom +"><Icon name="zoomin" size={14}/></button>
          <button className="tool-btn" onClick={()=>setZoom(z=>clampZ(z*.8))} title="Zoom –"><Icon name="zoomout" size={14}/></button>
          <button className="tool-btn" onClick={()=>{setZoom(1);setOffset({x:20,y:20});}} title="Réinitialiser vue">⊙ Reset</button>
          <div className="editor-toolbar-sep"/>
          <label className="snap-toggle" title="Accrochage à la grille">
            <input type="checkbox" checked={showGrid} onChange={e=>setShowGrid(e.target.checked)}/>
            Grille
          </label>
          <label className="snap-toggle" title="Snap à la grille">
            <input type="checkbox" checked={snap} onChange={e=>setSnapEnabled(e.target.checked)}/>
            Snap
          </label>
          <select className="prop-input" style={{width:60,padding:"4px 6px",fontSize:11}} value={gridSize} onChange={e=>setGridSize(+e.target.value)}>
            {[5,10,20,40].map(g=><option key={g} value={g}>{g}px</option>)}
          </select>
          <div className="editor-toolbar-sep"/>
          <button className="tool-btn active" onClick={saveMap}><Icon name="save" size={14}/> Sauvegarder</button>
        </div>

        {/* Canvas SVG */}
        <div className="editor-canvas-wrap" ref={canvasRef}
          style={{cursor:tool==="draw"?"crosshair":panRef.current?"grabbing":"grab"}}
          onMouseDown={onCanvasMouseDown}
          onContextMenu={e=>e.preventDefault()}>
          <svg width="100%" height="100%" style={{display:"block"}}>
            <g transform={`translate(${offset.x},${offset.y}) scale(${zoom})`}>
              {/* Fond canvas */}
              <rect width={CANVAS_W} height={CANVAS_H} fill="#ece8e2" rx="4"/>
              {/* Grille */}
              {showGrid&&(
                <g opacity="0.4">
                  {Array.from({length:Math.ceil(CANVAS_W/gridSize)+1},(_,i)=><line key={"v"+i} x1={i*gridSize} y1={0} x2={i*gridSize} y2={CANVAS_H} stroke="#c0b8b0" strokeWidth="0.5"/>)}
                  {Array.from({length:Math.ceil(CANVAS_H/gridSize)+1},(_,i)=><line key={"h"+i} x1={0} y1={i*gridSize} x2={CANVAS_W} y2={i*gridSize} stroke="#c0b8b0" strokeWidth="0.5"/>)}
                </g>
              )}
              {/* Bordure canvas */}
              <rect width={CANVAS_W} height={CANVAS_H} fill="none" stroke="#cec5bb" strokeWidth="1" rx="4"/>
              {/* Halls */}
              {halls.map(h=>(
                <g key={h.id}>
                  <rect x={h.x} y={h.y} width={h.w} height={h.h} fill={h.color} stroke={h.border} strokeWidth="1.5" rx="8" strokeDasharray="6,3"/>
                  <text x={h.x+12} y={h.y+20} fill={h.border} fontSize="13" fontWeight="700" fontFamily="Cormorant Garamond">{h.name}</text>
                </g>
              ))}
              {/* Entrée */}
              <rect x={CANVAS_W/2-55} y={CANVAS_H-46} width="110" height="30" rx="5" fill="#7a203520" stroke="#7a203550"/>
              <text x={CANVAS_W/2} y={CANVAS_H-25} fill="#7a2035" fontSize="11" textAnchor="middle" fontFamily="DM Sans" fontWeight="500">ENTRÉE</text>
              <polygon points={`${CANVAS_W/2-10},${CANVAS_H-47} ${CANVAS_W/2+10},${CANVAS_H-47} ${CANVAS_W/2},${CANVAS_H-57}`} fill="#7a203580"/>
              {/* Stands */}
              {stands.map(s=>{
                const isSel=selectedId===s.id;
                return(
                  <g key={s.id} style={{cursor:tool==="draw"?"crosshair":"move"}}
                    onMouseDown={e=>{if(tool==="select")onStandMouseDown(s.id,e);}}
                    onClick={e=>{e.stopPropagation();if(tool==="select"){setSelectedId(s.id);}}}
                    onDoubleClick={e=>{e.stopPropagation();setEditStandModal(s);}}
                    onContextMenu={e=>onStandContextMenu(s.id,e)}>
                    <rect x={s.x} y={s.y} width={s.w} height={s.h} rx="6"
                      fill={isSel?hexRgba(s.color,.28):hexRgba(s.color,.12)}
                      stroke={isSel?"#7a2035":s.color} strokeWidth={isSel?2.5:1.5}/>
                    {isSel&&<rect x={s.x-3} y={s.y-3} width={s.w+6} height={s.h+6} rx="9" fill="none" stroke="#7a2035" strokeWidth="1" strokeDasharray="5,3" opacity="0.5"/>}
                    <text x={s.x+s.w/2} y={s.y+22} textAnchor="middle" fill={s.color} fontSize="16" fontFamily="DM Sans">{s.logo}</text>
                    <text x={s.x+s.w/2} y={s.y+37} textAnchor="middle" fill="#1e1a17" fontSize="9" fontFamily="DM Sans" fontWeight="500">{s.name.length>14?s.name.slice(0,14)+"…":s.name}</text>
                    <text x={s.x+s.w/2} y={s.y+49} textAnchor="middle" fill={s.color} fontSize="8" fontFamily="DM Sans">{s.number}</text>
                    {s.events.length>0&&<circle cx={s.x+s.w-8} cy={s.y+8} r="5" fill="#7a2035"/>}
                    {/* 8 resize handles */}
                    {isSel&&[
                      {hx:s.x,hy:s.y,c:"nw"},{hx:s.x+s.w/2,hy:s.y,c:"n"},{hx:s.x+s.w,hy:s.y,c:"ne"},
                      {hx:s.x+s.w,hy:s.y+s.h/2,c:"e"},{hx:s.x+s.w,hy:s.y+s.h,c:"se"},
                      {hx:s.x+s.w/2,hy:s.y+s.h,c:"s"},{hx:s.x,hy:s.y+s.h,c:"sw"},{hx:s.x,hy:s.y+s.h/2,c:"w"}
                    ].map(({hx,hy,c})=>(
                      <rect key={c} x={hx-5} y={hy-5} width="10" height="10" rx="2"
                        fill="#fff" stroke="#7a2035" strokeWidth="1.5"
                        style={{cursor:`${c}-resize`}}
                        onMouseDown={e=>{e.stopPropagation();onResizeStart(s.id,c,e);}}/>
                    ))}
                  </g>
                );
              })}
              {/* Rectangle de dessin en cours */}
              {drawing&&(()=>{
                const x=Math.min(drawing.sx,drawing.ex),y=Math.min(drawing.sy,drawing.ey);
                const w=Math.abs(drawing.ex-drawing.sx),h=Math.abs(drawing.ey-drawing.sy);
                return(<rect x={x} y={y} width={w} height={h} fill="#7a203510" stroke="#7a2035" strokeWidth="1.5" strokeDasharray="6,3" rx="4"/>);
              })()}
            </g>
          </svg>
        </div>
        {/* Barre de statut */}
        <div className="editor-statusbar">
          <span>🖱 {status}</span>
          <span>Zoom : {Math.round(zoom*100)}%</span>
          <span>Canvas : {CANVAS_W}×{CANVAS_H}px</span>
          <span>Stands : {stands.length}</span>
          {selectedStand&&<span style={{color:"var(--accent)",fontWeight:500}}>Sélectionné : {selectedStand.name} ({selectedStand.number})</span>}
          <span style={{marginLeft:"auto",color:"var(--text3)"}}>Double-clic pour éditer · Clic droit pour options</span>
        </div>
      </div>

      {/* ── Colonne droite : propriétés ── */}
      <div className="editor-props">
        <div className="editor-props-header"><div className="editor-props-title">Propriétés</div></div>
        <div className="editor-props-body">
          {!selectedStand?(
            <div className="no-selection">
              <div className="no-selection-icon">↖</div>
              <div className="no-selection-text">Cliquez sur un stand pour afficher et modifier ses propriétés.<br/><br/>Double-clic pour éditer les informations complètes.<br/><br/>Clic droit pour le menu contextuel.</div>
            </div>
          ):(
            <>
              <div className="prop-section">
                <div className="prop-section-title">Identité</div>
                <div className="prop-row"><span className="prop-label">Nom</span><input className="prop-input" value={selectedStand.name} onChange={e=>updateProp("name",e.target.value)} onBlur={commitProp}/></div>
                <div className="prop-row"><span className="prop-label">Numéro</span><input className="prop-input" value={selectedStand.number} onChange={e=>updateProp("number",e.target.value)} onBlur={commitProp}/></div>
                <div className="prop-row"><span className="prop-label">Hall</span>
                  <select className="prop-input" value={selectedStand.hall} onChange={e=>{updateProp("hall",e.target.value);commitProp();}}>
                    {halls.map(h=><option key={h.id} value={h.id}>{h.name}</option>)}
                  </select>
                </div>
                <div style={{marginTop:10}}>
                  <button className="btn-primary" style={{width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setEditStandModal(selectedStand)}>
                    <Icon name="edit" size={13}/> Éditer les infos complètes
                  </button>
                </div>
              </div>

              <div className="prop-section">
                <div className="prop-section-title">Position & Taille</div>
                <div className="prop-row-2">
                  {[["x","X (px)"],["y","Y (px)"]].map(([k,l])=>(
                    <div key={k} className="prop-field"><label>{l}</label><input type="number" className="prop-input" value={selectedStand[k]} onChange={e=>updateProp(k,e.target.value)} onBlur={commitProp}/></div>
                  ))}
                </div>
                <div className="prop-row-2">
                  {[["w","Larg. (px)"],["h","Haut. (px)"]].map(([k,l])=>(
                    <div key={k} className="prop-field"><label>{l}</label><input type="number" className="prop-input" value={selectedStand[k]} onChange={e=>updateProp(k,e.target.value)} onBlur={commitProp}/></div>
                  ))}
                </div>
              </div>

              <div className="prop-section">
                <div className="prop-section-title">Alignement</div>
                <div className="align-btns">
                  {[["left","◀ Gauche"],["cx","↔ Centrer H"],["right","Droite ▶"],["top","▲ Haut"],["cy","↕ Centrer V"],["bottom","Bas ▼"]].map(([m,l])=>(
                    <button key={m} className="align-btn" onClick={()=>align(m)}>{l}</button>
                  ))}
                </div>
              </div>

              <div className="prop-section">
                <div className="prop-section-title">Apparence</div>
                <div style={{marginBottom:10}}>
                  <div className="form-label" style={{marginBottom:6}}>Icône</div>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                    {EMOJIS.map(e=><button key={e} onClick={()=>{updateProp("logo",e);commitProp();}} style={{fontSize:16,width:30,height:30,border:`1.5px solid ${selectedStand.logo===e?"var(--accent)":"var(--border2)"}`,borderRadius:6,background:selectedStand.logo===e?"var(--accent-dim)":"var(--bg3)",cursor:"pointer"}}>{e}</button>)}
                  </div>
                </div>
                <div>
                  <div className="form-label" style={{marginBottom:6}}>Couleur</div>
                  <div className="color-options">
                    {STAND_COLORS.map(c=><div key={c} className={`color-swatch ${selectedStand.color===c?"selected":""}`} style={{background:c,width:22,height:22}} onClick={()=>{updateProp("color",c);commitProp();}}/>)}
                  </div>
                </div>
              </div>

              <div className="prop-section">
                <div className="prop-section-title">Actions</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <button className="btn-secondary" style={{justifyContent:"center",fontSize:12}} onClick={()=>duplicateStand(selectedStand.id)}><Icon name="duplicate" size={13}/> Dupliquer</button>
                  <button className="btn-danger" style={{justifyContent:"center"}} onClick={()=>deleteStandEditor(selectedStand.id)}><Icon name="trash" size={13}/> Supprimer du plan</button>
                </div>
              </div>
            </>
          )}

          {/* Halls */}
          <div className="prop-section" style={{marginTop:selectedStand?8:0}}>
            <div className="prop-section-title">Halls</div>
            <div className="halls-list">
              {halls.map(h=>(
                <div key={h.id} className="hall-row">
                  <div className="hall-color" style={{background:h.border}}/>
                  <div className="hall-name">{h.name}</div>
                  <div className="hall-count">{stands.filter(s=>s.hall===h.id).length} stands</div>
                </div>
              ))}
            </div>
          </div>

        </div>
      </div>

      {/* Context menu */}
      {ctxMenu&&(
        <div className="ctx-menu" style={{left:ctxMenu.x,top:ctxMenu.y}} onMouseLeave={()=>setCtxMenu(null)}>
          <div className="ctx-item" onClick={()=>{const s=stands.find(x=>x.id===ctxMenu.standId);if(s)setEditStandModal(s);setCtxMenu(null);}}><Icon name="edit" size={14}/> Éditer les infos</div>
          <div className="ctx-item" onClick={()=>{duplicateStand(ctxMenu.standId);setCtxMenu(null);}}><Icon name="duplicate" size={14}/> Dupliquer</div>
          <div className="ctx-sep"/>
          <div className="ctx-item" onClick={()=>{align("left");setCtxMenu(null);}}>◀ Aligner à gauche</div>
          <div className="ctx-item" onClick={()=>{align("cx");setCtxMenu(null);}}>↔ Centrer horiz.</div>
          <div className="ctx-item" onClick={()=>{align("top");setCtxMenu(null);}}>▲ Aligner en haut</div>
          <div className="ctx-item" onClick={()=>{align("cy");setCtxMenu(null);}}>↕ Centrer vert.</div>
          <div className="ctx-sep"/>
          <div className="ctx-item danger" onClick={()=>{deleteStandEditor(ctxMenu.standId);setCtxMenu(null);}}><Icon name="trash" size={14}/> Supprimer</div>
        </div>
      )}

      {/* Edit stand modal */}
      {editStandModal&&<StandModal stand={editStandModal} onSave={data=>{
        setStands(prev=>{const next=prev.map(s=>s.id===data.id?{...s,...data}:s);pushHistory(next);return next;});
        showToast("Stand mis à jour ✓");setEditStandModal(null);
      }} onClose={()=>setEditStandModal(null)}/>}

      {/* Confirm */}
      {confirm&&(
        <div className="modal-overlay"><div className="modal" style={{maxWidth:380}}>
          <div className="modal-header"><div className="modal-title">Confirmation</div><button className="btn-icon" onClick={()=>setConfirm(null)}><Icon name="close" size={15}/></button></div>
          <div className="modal-body"><div style={{color:"var(--text2)",fontSize:14,lineHeight:1.6,marginBottom:6}}>{confirm.msg}</div><div style={{fontSize:12,color:"var(--text3)"}}>Cette action est irréversible.</div></div>
          <div className="modal-footer"><button className="btn-secondary" onClick={()=>setConfirm(null)}>Annuler</button><button className="btn-danger" style={{padding:"9px 18px"}} onClick={confirm.onConfirm}><Icon name="trash" size={14}/> Supprimer</button></div>
        </div></div>
      )}
    </div>
  );
}

/* ── STAND MODAL ── */
function StandModal({stand,onSave,onClose}){
  const isNew=!stand.id;
  const [form,setForm]=useState({name:stand.name||"",number:stand.number||"",hall:stand.hall||"A",sector:stand.sector||SECTORS[0],description:stand.description||"",contact:stand.contact||"",website:stand.website||"",logo:stand.logo||"🏢",color:stand.color||STAND_COLORS[0],x:stand.x||50,y:stand.y||50,w:stand.w||110,h:stand.h||70});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  return(
    <div className="modal-overlay"><div className="modal">
      <div className="modal-header"><div className="modal-title">{isNew?"Nouveau stand":`Modifier — ${stand.name}`}</div><button className="btn-icon" onClick={onClose}><Icon name="close" size={15}/></button></div>
      <div className="modal-body"><div className="form-grid">
        <div className="form-group full"><label className="form-label">Nom *</label><input className="form-input" value={form.name} onChange={e=>set("name",e.target.value)}/></div>
        <div className="form-group"><label className="form-label">N° de stand</label><input className="form-input" value={form.number} onChange={e=>set("number",e.target.value)} placeholder="A01"/></div>
        <div className="form-group"><label className="form-label">Hall</label><select className="form-select" value={form.hall} onChange={e=>set("hall",e.target.value)}>{["A","B","C","D"].map(h=><option key={h}>{h}</option>)}</select></div>
        <div className="form-group full"><label className="form-label">Secteur</label><select className="form-select" value={form.sector} onChange={e=>set("sector",e.target.value)}>{SECTORS.map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="form-group full"><label className="form-label">Description</label><textarea className="form-textarea" value={form.description} onChange={e=>set("description",e.target.value)}/></div>
        <div className="form-group"><label className="form-label">Email contact</label><input className="form-input" value={form.contact} onChange={e=>set("contact",e.target.value)}/></div>
        <div className="form-group"><label className="form-label">Site web</label><input className="form-input" value={form.website} onChange={e=>set("website",e.target.value)}/></div>
        <div className="form-group full"><label className="form-label">Icône</label><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{EMOJIS.map(e=><button key={e} onClick={()=>set("logo",e)} style={{fontSize:22,width:40,height:40,border:`2px solid ${form.logo===e?"var(--accent)":"var(--border2)"}`,borderRadius:8,background:form.logo===e?"var(--accent-dim)":"var(--bg3)",cursor:"pointer"}}>{e}</button>)}</div></div>
        <div className="form-group full"><label className="form-label">Couleur</label><div className="color-options">{STAND_COLORS.map(c=><div key={c} className={`color-swatch ${form.color===c?"selected":""}`} style={{background:c}} onClick={()=>set("color",c)}/>)}</div></div>
      </div></div>
      <div className="modal-footer"><button className="btn-secondary" onClick={onClose}>Annuler</button><button className="btn-primary" onClick={()=>{if(form.name)onSave({...stand,...form});}}>{isNew?<><Icon name="plus" size={14}/> Créer</>:<><Icon name="edit" size={14}/> Enregistrer</>}</button></div>
    </div></div>
  );
}

/* ── EVENT MODAL ── */
function EventModal({standId,event,onSave,onClose}){
  const isNew=!event.id;
  const [form,setForm]=useState({title:event.title||"",type:event.type||"news",date:event.date||new Date().toISOString().slice(0,10),desc:event.desc||""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  return(
    <div className="modal-overlay"><div className="modal" style={{maxWidth:460}}>
      <div className="modal-header"><div className="modal-title">{isNew?"Nouvel événement":"Modifier l'événement"}</div><button className="btn-icon" onClick={onClose}><Icon name="close" size={15}/></button></div>
      <div className="modal-body"><div className="form-grid">
        <div className="form-group full"><label className="form-label">Titre *</label><input className="form-input" value={form.title} onChange={e=>set("title",e.target.value)}/></div>
        <div className="form-group"><label className="form-label">Type</label><select className="form-select" value={form.type} onChange={e=>set("type",e.target.value)}>{EVENT_TYPES.map(t=><option key={t} value={t}>{EVENT_LABELS[t]}</option>)}</select></div>
        <div className="form-group"><label className="form-label">Date</label><input className="form-input" type="date" value={form.date} onChange={e=>set("date",e.target.value)}/></div>
        <div className="form-group full"><label className="form-label">Description</label><textarea className="form-textarea" value={form.desc} onChange={e=>set("desc",e.target.value)}/></div>
      </div></div>
      <div className="modal-footer"><button className="btn-secondary" onClick={onClose}>Annuler</button><button className="btn-primary" onClick={()=>{if(form.title)onSave(standId,{...event,...form});}}>{isNew?<><Icon name="plus" size={14}/> Créer</>:<><Icon name="edit" size={14}/> Enregistrer</>}</button></div>
    </div></div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
